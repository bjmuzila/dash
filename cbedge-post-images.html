<!-- CB Edge — Post Info-Graphics (branded). Open in a browser, click "Download PNG" or "Download all". -->
<meta charset="utf-8">
<title>CB Edge — Post Graphics</title>
<style>
  body{margin:0;background:#04060b;color:#e9eff7;font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif}
  header{position:sticky;top:0;z-index:5;background:#04060bee;backdrop-filter:blur(6px);
    padding:16px 24px;border-bottom:1px solid #14202f;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;letter-spacing:.5px}
  header .sub{color:#7e8da6;font-size:13px}
  button{cursor:pointer;border:1px solid #1e9fb0;background:#0a2028;color:#35d6e8;font-weight:700;
    padding:8px 14px;border-radius:8px;font-size:13px}
  button:hover{background:#0e2c37}
  .wrap{max-width:900px;margin:0 auto;padding:22px}
  .card{margin:0 0 30px}
  .bar{display:flex;justify-content:space-between;align-items:center;margin:0 0 9px}
  .bar .lbl{color:#7e8da6;font-size:13px}.bar .lbl b{color:#e9eff7}
  .frame{border-radius:12px;overflow:hidden;border:1px solid #14202f;box-shadow:0 10px 40px #0009}
  svg{display:block;width:100%;height:auto}
  .copy{margin-top:9px;white-space:pre-wrap;color:#c6d1e0;font-size:13px;background:#070d16;
    border:1px solid #14202f;border-radius:8px;padding:10px 12px}
</style>
<header>
  <h1>CB&nbsp;Edge — 19 Post Graphics</h1>
  <span class="sub">click a graphic's button for a 1600×900 PNG (3200×1800 export)</span>
  <button onclick="downloadAll()">⬇ Download all PNGs</button>
</header>
<div class="wrap" id="wrap"></div>

<script>
const W=1600,H=900;
const C={cyan:"#35d6e8",cyanDim:"#1e9fb0",blueHi:"#52a9e6",blueLo:"#164a8c",gold:"#e0a22b",goldLo:"#8a5f12",
  green:"#35d38a",greenBar:"#3fd07e",red:"#e24b4a",text:"#ffffff",muted:"#ffffff",panel:"#0a121e"};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function rnd(i){return ((i*9301+49297)%233280)/233280;}

function defs(){return `<defs>
<radialGradient id="bg" cx="22%" cy="12%" r="130%"><stop offset="0%" stop-color="#0b1420"/><stop offset="55%" stop-color="#060a12"/><stop offset="100%" stop-color="#02040a"/></radialGradient>
<linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="45%" stop-color="#c3ccd6"/><stop offset="55%" stop-color="#8f99a5"/><stop offset="100%" stop-color="#e6ebf0"/></linearGradient>
<linearGradient id="bl" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${C.blueHi}"/><stop offset="100%" stop-color="${C.blueLo}"/></linearGradient>
<linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${C.goldLo}"/><stop offset="100%" stop-color="${C.gold}"/></linearGradient>
</defs>`;}
function logo(){return `<g font-family="Inter,Segoe UI,Arial">
  <text x="86" y="112" font-size="48" font-weight="800" fill="url(#chrome)" stroke="#5a636d" stroke-width="0.6" letter-spacing="2">CB Edge</text>
  <text x="90" y="142" font-size="16" font-style="italic" fill="${C.muted}" letter-spacing="1">&#8220;Real Edge - Real Orderflow&#8221;</text></g>`;}
function header(section,statHtml){
  return `<g font-family="Inter,Segoe UI,Arial" text-anchor="end">
    <text x="${W-86}" y="80" font-size="15" font-weight="700" fill="${C.cyan}" letter-spacing="2">${esc(section)}</text>
    <text x="${W-86}" y="112" font-size="16" font-weight="700" fill="${C.muted}">${statHtml}</text></g>`;
}
function footer(){return `<text x="86" y="${H-58}" font-family="Inter,Segoe UI,Arial" font-size="32" font-weight="800" fill="${C.cyan}">cbedge.net</text>
  <circle cx="330" cy="${H-67}" r="6" fill="${C.green}"/><text x="346" y="${H-60}" font-family="Inter,Segoe UI,Arial" font-size="18" font-weight="700" fill="${C.green}" letter-spacing="1">LIVE</text>`;}
function headline(lines,small){
  let y=455-(lines.length-2)*56;
  let t=`<g font-family="Inter,Segoe UI,Arial">`;
  lines.forEach((ln,i)=>{ t+=`<text x="82" y="${y+i*112}" font-size="100" font-weight="800" fill="${ln[1]||C.text}">${esc(ln[0])}</text>`;});
  t+=`<text x="86" y="${y+lines.length*112-46}" font-size="30" font-weight="500" fill="${C.muted}">${esc(small)}</text></g>`;
  return t;
}

/* ---- motifs (faint, behind text) ---- */
function mBars(){let s="";const n=64,bw=W/n,base=H*0.60,amp=150,cycles=1;
  for(let i=0;i<n;i++){
    const v=-Math.sin((i+0.5)/n*cycles*2*Math.PI);   // one negative hump (left) then one positive hump (right)
    const jitter=0.45+rnd(i*7+3)*0.75;               // randomize each bar
    const mag=Math.abs(v)*amp*jitter;
    const up=v>=0;                                    // positive/up = blue, negative/down = gold
    if(up){ s+=`<rect x="${i*bw+3}" y="${base-mag}" width="${bw-5}" height="${mag}" fill="url(#bl)" opacity="0.26"/>`; }
    else  { s+=`<rect x="${i*bw+3}" y="${base}" width="${bw-5}" height="${mag}" fill="url(#gd)" opacity="0.26"/>`; }
  }
  s+=`<line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="${C.cyan}" stroke-width="1.5" stroke-dasharray="9 8" opacity=".4"/>`;
  return s;}
function mLevels(){const L=[[C.green,210],[C.cyan,470],[C.red,690]];
  let s="";for(const [c,y] of L){s+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="${c}" stroke-width="3" stroke-dasharray="14 10" opacity=".18"/>`;}return s;}
function mZones(){return `<rect x="0" y="150" width="${W}" height="170" fill="${C.green}" opacity="0.06"/>
  <rect x="0" y="600" width="${W}" height="180" fill="${C.red}" opacity="0.06"/>
  <line x1="0" y1="320" x2="${W}" y2="320" stroke="${C.green}" stroke-width="3" stroke-dasharray="14 10" opacity=".18"/>
  <line x1="0" y1="600" x2="${W}" y2="600" stroke="${C.red}" stroke-width="3" stroke-dasharray="14 10" opacity=".18"/>`;}
function mTarget(){const cx=1300,cy=460;let s="";[220,158,96,42].forEach((r,i)=>{
    s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${i%2?C.green:C.cyan}" stroke-width="7" opacity="${0.08+i*0.03}"/>`;});
  s+=`<circle cx="${cx}" cy="${cy}" r="16" fill="${C.green}" opacity=".28"/>`;return s;}
function mFlow(){let s="";for(let i=0;i<8;i++){const y=176+i*48;s+=`<rect x="900" y="${y}" width="600" height="30" rx="5" fill="${i%2?C.red:C.green}" opacity="0.06"/>`;}
  let p=`M 0 ${H*0.6}`;for(let i=1;i<=24;i++)p+=` L ${i*(W/24)} ${H*0.6-(30+i*3+Math.sin(i)*22)}`;
  s+=`<path d="${p}" fill="none" stroke="${C.cyan}" stroke-width="2.5" opacity=".22"/>`;return s;}
const MOTIF={bars:mBars,levels:mLevels,zones:mZones,target:mTarget,flow:mFlow};

function logoAt(x,y,anchor){const a=anchor||"start";return `<g font-family="Inter,Segoe UI,Arial" text-anchor="${a}">
  <text x="${x}" y="${y}" font-size="44" font-weight="800" fill="url(#chrome)" stroke="#5a636d" stroke-width="0.6" letter-spacing="2">CB Edge</text>
  <text x="${x}" y="${y+28}" font-size="15" font-style="italic" fill="${C.text}">&#8220;Real Edge - Real Orderflow&#8221;</text></g>`;}
function footerCenter(){return `<g font-family="Inter,Segoe UI,Arial"><circle cx="${W/2-118}" cy="${H-67}" r="6" fill="${C.green}"/><text x="${W/2}" y="${H-58}" text-anchor="middle" font-size="32" font-weight="800" fill="${C.cyan}">cbedge.net</text></g>`;}
function HL(lines,small,x,y,size,anchor){const a=anchor||"start";let t=`<g font-family="Inter,Segoe UI,Arial" text-anchor="${a}">`;
  lines.forEach((ln,i)=>{t+=`<text x="${x}" y="${y+i*(size*1.12)}" font-size="${size}" font-weight="800" fill="${ln[1]||C.text}">${esc(ln[0])}</text>`;});
  t+=`<text x="${x}" y="${y+lines.length*(size*1.12)-(size*0.40)}" font-size="30" font-weight="500" fill="${C.text}">${esc(small)}</text></g>`;return t;}

function mockHeatmap(){
  const px=858,py=132,pw=690,ph=636;
  let s=`<rect x="${px}" y="${py}" width="${pw}" height="${ph}" rx="12" fill="#0a121e" stroke="#16233b"/>`;
  s+=`<text x="${px+22}" y="${py+36}" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="800" fill="${C.cyan}" letter-spacing="1">LIVE GEX HEATMAP</text>`;
  s+=`<text x="${px+pw-22}" y="${py+36}" text-anchor="end" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="700" fill="${C.text}">0DTE · 07-06</text>`;
  const cx={strike:px+22,gex:px+300,dex:px+470,vex:px+pw-22};
  const hy=py+66;
  [["STRIKE",cx.strike,"start"],["NET GEX",cx.gex,"end"],["DEX",cx.dex,"end"],["NET VEX",cx.vex,"end"]]
    .forEach(([k,x,a])=>{s+=`<text x="${x}" y="${hy}" text-anchor="${a}" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="700" fill="#7e8da6" letter-spacing="1">${k}</text>`;});
  const rows=[[7545,172,51,18],[7540,193,28,19],[7535,90,19,8],[7530,117,-3,9],[7525,44,-508,7],[7520,646,370,36,1],[7515,440,279,20,2],[7510,261,111,10],[7505,-5,-9,-11],[7500,-590,-199,-60,1],[7495,-142,-47,-6],[7490,-105,-1,-2],[7485,-132,-41,421,0]];
  const rh=(ph-88)/rows.length;
  rows.forEach((r,i)=>{const ry=py+80+i*rh, atm=(r[4]===0), ng=r[1];
    const tint=ng>=0?C.blueHi:C.red, op=Math.min(0.42,Math.abs(ng)/700*0.42);
    s+=`<rect x="${px+150}" y="${ry}" width="240" height="${rh-3}" fill="${tint}" opacity="${op}"/>`;
    if(r[4]===1||r[4]===2) s+=`<rect x="${px+22}" y="${ry+rh/2-9}" width="26" height="18" rx="3" fill="${C.gold}"/><text x="${px+35}" y="${ry+rh/2+4}" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="11" font-weight="800" fill="#0a121e">#${r[4]}</text>`;
    if(atm) s+=`<rect x="${px+8}" y="${ry-1}" width="${pw-16}" height="${rh-1}" fill="none" stroke="${C.gold}" stroke-width="1.5" opacity=".6"/>`;
    s+=`<text x="${px+ (r[4]===1||r[4]===2?60:22)}" y="${ry+rh/2+4}" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="700" fill="${atm?C.cyan:C.text}">${r[0].toLocaleString()}${atm?" ATM":""}</text>`;
    s+=`<text x="${cx.gex}" y="${ry+rh/2+4}" text-anchor="end" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="700" fill="${ng>=0?C.green:C.red}">${ng>=0?"+":"-"}$${Math.abs(ng)}M</text>`;
    s+=`<text x="${cx.dex}" y="${ry+rh/2+4}" text-anchor="end" font-family="Inter,Segoe UI,Arial" font-size="13" fill="${r[2]>=0?C.green:C.red}">${r[2]>=0?"+":"-"}$${Math.abs(r[2])}M</text>`;
    s+=`<text x="${cx.vex}" y="${ry+rh/2+4}" text-anchor="end" font-family="Inter,Segoe UI,Arial" font-size="13" fill="${r[3]>=0?C.green:C.red}">${r[3]>=0?"+":"-"}$${Math.abs(r[3])}M</text>`;});
  return s;
}
function mockEM(){
  const px=858,py=132,pw=690,ph=636,ix=px+22,iw=pw-44,ir=px+pw-22;
  let s=`<rect x="${px}" y="${py}" width="${pw}" height="${ph}" rx="12" fill="#0a121e" stroke="#16233b"/>`;
  s+=`<text x="${ix}" y="${py+36}" font-family="Inter,Segoe UI,Arial" font-size="18" font-weight="800" fill="${C.text}">SPX <tspan font-size="13" font-weight="600" fill="#7e8da6">WEEK OF 7/2</tspan></text>`;
  s+=`<text x="${ir}" y="${py+36}" text-anchor="end" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="700" fill="${C.cyan}">ESTIMATED MOVE</text>`;
  const cards=[["CLOSE","7,354.02",C.text],["EM","115.5",C.gold],["UP","7,469.54",C.green],["DOWN","7,238.50",C.red]];
  const cw=(iw-3*12)/4;
  cards.forEach((c,i)=>{const x=ix+i*(cw+12),y=py+54;
    s+=`<rect x="${x}" y="${y}" width="${cw}" height="94" rx="8" fill="#0d1524" stroke="#16233b"/>
      <text x="${x+cw/2}" y="${y+30}" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="700" fill="#7e8da6" letter-spacing="1">${c[0]}</text>
      <text x="${x+cw/2}" y="${y+66}" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="22" font-weight="800" fill="${c[2]}">${c[1]}</text>`;});
  const hy=py+170;
  s+=`<rect x="${ix}" y="${hy}" width="${iw}" height="96" rx="8" fill="#0d1524" stroke="#16233b"/>
    <text x="${ix+iw/2}" y="${hy+28}" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="700" fill="#7e8da6" letter-spacing="1">EM HIT RATE</text>
    <text x="${ix+iw/2}" y="${hy+52}" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="22" font-weight="800" fill="${C.gold}">63% Hit</text>
    <rect x="${ix+20}" y="${hy+66}" width="${iw-40}" height="10" rx="5" fill="#12202e"/>
    <rect x="${ix+20}" y="${hy+66}" width="${(iw-40)*0.63}" height="10" rx="5" fill="${C.green}"/>
    <text x="${ix+20}" y="${hy+90}" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#7e8da6">Miss (25)</text>
    <text x="${ir-20}" y="${hy+90}" text-anchor="end" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#7e8da6">Hit (43)</text>`;
  const zy=py+288,zw=(iw-16)/2,zh=200;
  const zone=(x,title,col,near,far)=>`<rect x="${x}" y="${zy}" width="${zw}" height="${zh}" rx="8" fill="#0d1524" stroke="${col}" stroke-opacity=".5"/>
    <text x="${x+20}" y="${zy+34}" font-family="Inter,Segoe UI,Arial" font-size="15" font-weight="800" fill="${col}" letter-spacing="1">${title}</text>
    <text x="${x+20}" y="${zy+92}" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="700" fill="#7e8da6">NEAR</text>
    <text x="${x+zw-20}" y="${zy+92}" text-anchor="end" font-family="Inter,Segoe UI,Arial" font-size="22" font-weight="800" fill="${col}">${near}</text>
    <text x="${x+20}" y="${zy+150}" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="700" fill="#7e8da6">FAR</text>
    <text x="${x+zw-20}" y="${zy+150}" text-anchor="end" font-family="Inter,Segoe UI,Arial" font-size="22" font-weight="800" fill="${col}">${far}</text>`;
  s+=zone(ix,"BUY ZONE",C.green,"7,157.00","7,066.75");
  s+=zone(ix+zw+16,"SELL ZONE",C.red,"7,628.50","7,718.75");
  return s;
}
function mockChart(){
  const px=858,py=132,pw=690,ph=636,L=px+8,R=px+pw-62,T=py+30,B=py+ph-26,PW2=R-(px+8),PH2=(py+ph-26)-(py+30);
  let s=`<clipPath id="cc"><rect x="${px}" y="${py}" width="${pw}" height="${ph}" rx="12"/></clipPath>`;
  s+=`<rect x="${px}" y="${py}" width="${pw}" height="${ph}" rx="12" fill="#08101c" stroke="#16233b"/><g clip-path="url(#cc)">`;
  const bands=26,bh=PH2/bands;
  for(let b=0;b<bands;b++){const yy=T+b*bh,upper=b<bands*0.5,segs=6,sw=PW2/segs;
    for(let c=0;c<segs;c++){const op=(rnd(b*segs+c+1)*0.34).toFixed(2);
      s+=`<rect x="${L+c*sw}" y="${yy}" width="${sw+1}" height="${bh+1}" fill="${upper?'#1e6fb0':'#7a1e1e'}" opacity="${op}"/>`;}}
  const n=46,cw=PW2/n,closes=[];let price=0;
  for(let i=0;i<n;i++){price+=(rnd(i*3+2)-0.47)*2;closes.push(price);}
  const mn=Math.min(...closes)-1.5,mx=Math.max(...closes)+1.5,yOf=v=>T+(1-(v-mn)/(mx-mn))*PH2;
  let prev=closes[0];
  for(let i=0;i<n;i++){const c=closes[i],o=prev,hi=Math.max(o,c)+rnd(i*5+1)*0.8,lo=Math.min(o,c)-rnd(i*7+1)*0.8;
    const x=L+i*cw+cw/2,up=c>=o,col=up?'#26c281':'#e24b4a';
    s+=`<line x1="${x}" y1="${yOf(hi)}" x2="${x}" y2="${yOf(lo)}" stroke="${col}" stroke-width="1.4"/>
      <rect x="${x-cw*0.3}" y="${yOf(Math.max(o,c))}" width="${cw*0.6}" height="${Math.max(1,Math.abs(yOf(o)-yOf(c)))}" fill="${col}"/>`;prev=c;}
  const wl=yOf(mx-1.0);s+=`<line x1="${L}" y1="${wl}" x2="${L+PW2*0.52}" y2="${wl}" stroke="#ffffff" stroke-width="2"/>`;
  const cur=yOf(closes[n-1]);s+=`<line x1="${L}" y1="${cur}" x2="${R}" y2="${cur}" stroke="${C.green}" stroke-width="1" stroke-dasharray="4 4" opacity=".8"/></g>`;
  s+=`<rect x="${R}" y="${cur-13}" width="60" height="26" rx="3" fill="${C.red}"/><text x="${R+30}" y="${cur+5}" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="800" fill="#fff">7,554</text>`;
  s+=`<rect x="${L+8}" y="${py+40}" width="108" height="24" rx="4" fill="#0b2a3a" stroke="${C.cyan}"/><text x="${L+62}" y="${py+57}" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="800" fill="${C.cyan}">SPX 7,554</text>`;
  for(let t=0;t<=5;t++){const y=T+PH2*t/5;s+=`<text x="${px+pw-52}" y="${y+4}" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#7e8da6">${(7600-t*30)}</text>`;}
  return s;
}
function mockFeatures(){
  const px=858,py=132,pw=690,ph=636,ix=px+22,iw=pw-44;
  let s=`<rect x="${px}" y="${py}" width="${pw}" height="${ph}" rx="12" fill="#0a121e" stroke="#16233b"/>`;
  const intro=["A real-time SPX gamma-exposure & options-flow dashboard",
    "for serious 0DTE and index traders. See dealer positioning,",
    "flow, and key levels the moment they move."];
  intro.forEach((ln,i)=>{s+=`<text x="${ix}" y="${py+34+i*22}" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="500" fill="${C.text}">${ln}</text>`;});
  const cards=[
    ["Real-time SPX GEX",["Live gamma exposure profiles and","flip levels straight from the","options chain."]],
    ["Confidence Score",["Each key level scored 0–100 for","Hit, Pivot or Chop — live positioning","blended with historical analogs."]],
    ["ICT — Inner Circle Trader",["Live FVGs, order blocks, liquidity","and market structure on ES and NQ","— called as they form."]],
    ["Estimated moves",["Weekly estimated-move levels with","high-confidence zones, backed by","2+ years of historical data."]],
  ];
  const gap=14,cw=(iw-gap)/2,y0=py+118,ch=(ph-118-22-gap)/2;
  cards.forEach((c,i)=>{const cx=ix+(i%2)*(cw+gap),cy=y0+Math.floor(i/2)*(ch+gap);
    s+=`<rect x="${cx}" y="${cy}" width="${cw}" height="${ch}" rx="10" fill="#0d1524" stroke="#16233b"/>`;
    s+=`<text x="${cx+18}" y="${cy+34}" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="800" fill="${C.text}">${c[0]}</text>`;
    c[1].forEach((ln,j)=>{s+=`<text x="${cx+18}" y="${cy+62+j*20}" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#c6d1e0">${ln}</text>`;});
    s+=`<text x="${cx+18}" y="${cy+ch-18}" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="700" fill="${C.cyan}">Explore →</text>`;});
  return s;
}
function mockICT(){
  const px=858,py=132,pw=690,ph=636;
  let s=`<rect x="${px}" y="${py}" width="${pw}" height="${ph}" rx="12" fill="#0a121e" stroke="#16233b"/>`;
  const cx0=px+10,cy0=py+10,cw2=pw-20,chh=284;
  const L=cx0+2,R=cx0+cw2-48,T=cy0+8,B=cy0+chh-8,PW2=R-L,PH2=B-T;
  s+=`<clipPath id="ic"><rect x="${cx0}" y="${cy0}" width="${cw2}" height="${chh}" rx="8"/></clipPath>`;
  s+=`<rect x="${cx0}" y="${cy0}" width="${cw2}" height="${chh}" rx="8" fill="#08101c" stroke="#16233b"/><g clip-path="url(#ic)">`;
  const n=54,cw=PW2/n,closes=[];let price=0;
  for(let i=0;i<n;i++){price+=(rnd(i*3+4)-0.46)*2;closes.push(price);}
  const mn=Math.min(...closes)-2,mx=Math.max(...closes)+2,yOf=v=>T+(1-(v-mn)/(mx-mn))*PH2;
  s+=`<rect x="${L+PW2*0.62}" y="${T}" width="${PW2*0.38}" height="${Math.abs(yOf(mx-4)-T)}" fill="${C.green}" opacity="0.05"/>`;

const wrap=document.getElementById("wrap");
POSTS.forEach((p,idx)=>{
  const card=document.createElement("div");card.className="card";
  const style=["hero","center","framed","band"][idx%4];
  card.innerHTML=`<div class="bar"><div class="lbl">Post <b>#${p.n}</b> · ${style} · ${p.motif}</div>
    <button>⬇ Download PNG</button></div>
    <div class="frame" id="frame${p.n}">${buildSVG(p,idx)}</div>
    <div class="copy">${esc(p.copy)}</div>`;
  wrap.appendChild(card);
  card.querySelector("button").onclick=()=>downloadOne(p.n);
});
function downloadOne(n){
  const svg=document.querySelector(`#frame${n} svg`);
  const data=new XMLSerializer().serializeToString(svg);
  const img=new Image();
  img.onload=()=>{const s=2,cv=document.createElement("canvas");cv.width=W*s;cv.height=H*s;
    const ctx=cv.getContext("2d");ctx.fillStyle="#04060b";ctx.fillRect(0,0,cv.width,cv.height);
    ctx.drawImage(img,0,0,cv.width,cv.height);
    cv.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);
      a.download=`cbedge-post-${String(n).padStart(2,"0")}.png`;a.click();},"image/png");};
  img.src="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(data)));
}
function downloadAll(){POSTS.forEach((p,i)=>setTimeout(()=>downloadOne(p.n),i*450));}
</script>
