<!-- CB Edge — Post Info-Graphics Gallery. Open in a browser, click "Download PNG" (or Download All). -->
<meta charset="utf-8">
<title>CB Edge — Post Graphics</title>
<style>
  :root{
    --bg:#070b14; --panel:#0d1524; --panel2:#0b1220; --border:#16233b;
    --cyan:#35e0ee; --cyanDim:#1f9fb0; --blue:#3b82f6; --green:#22c55e;
    --red:#ef4444; --amber:#f59e0b; --text:#e6edf6; --muted:#7c8ba5;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#05070d;color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
  header{position:sticky;top:0;z-index:5;background:#05070dee;backdrop-filter:blur(6px);
    padding:18px 24px;border-bottom:1px solid var(--border);display:flex;
    align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;letter-spacing:.5px}
  header .sub{color:var(--muted);font-size:13px}
  button{cursor:pointer;border:1px solid var(--cyanDim);background:#0e2230;color:var(--cyan);
    font-weight:700;padding:8px 14px;border-radius:8px;font-size:13px}
  button:hover{background:#123243}
  .wrap{max-width:900px;margin:0 auto;padding:24px}
  .card{margin:0 0 34px}
  .card .bar{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}
  .card .bar .lbl{color:var(--muted);font-size:13px}
  .card .bar .lbl b{color:var(--text)}
  .frame{border-radius:14px;overflow:hidden;border:1px solid var(--border);box-shadow:0 10px 40px #0008}
  svg{display:block;width:100%;height:auto}
  .copy{margin-top:10px;white-space:pre-wrap;color:#cdd7e6;font-size:13px;
    background:#0b1220;border:1px solid var(--border);border-radius:8px;padding:10px 12px}
</style>

<header>
  <h1>CB&nbsp;EDGE — 20 Post Graphics</h1>
  <span class="sub">click a graphic's button to save a 1600×900 PNG</span>
  <button onclick="downloadAll()">⬇ Download all PNGs</button>
</header>
<div class="wrap" id="wrap"></div>

<script>
const C = {
  bg:"#070b14", panel:"#0d1524", panel2:"#0b1220", border:"#16233b",
  cyan:"#35e0ee", cyanDim:"#1f9fb0", blue:"#3b82f6", green:"#22c55e",
  red:"#ef4444", amber:"#f59e0b", text:"#e6edf6", muted:"#7c8ba5"
};
const W=1600, H=900;

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

// ---------- shared chrome ----------
function frame(inner){
  return `
  <defs>
    <radialGradient id="bgg" cx="30%" cy="0%" r="120%">
      <stop offset="0%" stop-color="#0c1626"/><stop offset="60%" stop-color="${C.bg}"/>
      <stop offset="100%" stop-color="#04060b"/>
    </radialGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="${C.cyan}"/><stop offset="100%" stop-color="${C.cyanDim}"/>
    </linearGradient>
  </defs>
  <rect width="${W}" height="${H}" fill="url(#bgg)"/>
  <!-- top bar -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="${W}" height="76" fill="#060a12"/>
    <line x1="0" y1="76" x2="${W}" y2="76" stroke="${C.border}"/>
    <text x="56" y="50" font-size="30" font-weight="800" fill="${C.text}" letter-spacing="1">CB<tspan fill="${C.cyan}"> EDGE</tspan></text>
    <circle cx="640" cy="40" r="6" fill="${C.green}"/>
    <text x="656" y="47" font-size="18" font-weight="700" fill="${C.green}">LIVE</text>
    <text x="${W-56}" y="47" text-anchor="end" font-size="20" font-weight="700" fill="${C.cyan}">cbedge.net</text>
  </g>
  ${tickerRow()}
  ${inner}
  <!-- footer cta -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <line x1="0" y1="${H-70}" x2="${W}" y2="${H-70}" stroke="${C.border}"/>
    <text x="56" y="${H-30}" font-size="22" font-weight="700" fill="${C.muted}">real-time SPX gamma · flow · levels</text>
    <rect x="${W-320}" y="${H-58}" width="264" height="40" rx="8" fill="url(#cy)"/>
    <text x="${W-188}" y="${H-31}" text-anchor="middle" font-size="20" font-weight="800" fill="#04121a">JOIN CB EDGE →</text>
  </g>`;
}
function tickerRow(){
  const items=[["VIX","15.97",C.text],["SPX","7,483",C.text],
    ["NET GEX","-316.8M",C.red],["CALL WALL","7,520",C.green],
    ["PUT WALL","7,475",C.red],["FLIP","7,482",C.cyan]];
  let x=56, out=`<g font-family="Segoe UI, Arial, sans-serif" transform="translate(0,110)">`;
  for(const [k,v,col] of items){
    out+=`<text x="${x}" y="0" font-size="15" fill="${C.muted}" font-weight="600">${k}</text>`;
    out+=`<text x="${x}" y="26" font-size="22" fill="${col}" font-weight="800">${v}</text>`;
    x+=250;
  }
  return out+`</g>`;
}
// headline block bottom-left
function headline(big, small, accent=C.cyan){
  const lines=big.split("\n");
  let ty=H-150-(lines.length-1)*54;
  let t=`<g font-family="Segoe UI, Arial, sans-serif">
    <rect x="56" y="${ty-58}" width="8" height="${lines.length*56+14}" rx="4" fill="${accent}"/>`;
  lines.forEach((l,i)=>{
    t+=`<text x="82" y="${ty+i*56}" font-size="52" font-weight="800" fill="${C.text}">${esc(l)}</text>`;
  });
  t+=`<text x="84" y="${ty+lines.length*56+10}" font-size="24" font-weight="600" fill="${C.muted}">${esc(small)}</text></g>`;
  return t;
}

// ---------- panel helper (the visual sits top-right area) ----------
const PX=760, PY=170, PW=784, PH=560; // visual panel box

function panel(title){
  return `<rect x="${PX}" y="${PY}" width="${PW}" height="${PH}" rx="14" fill="${C.panel}" stroke="${C.border}"/>
  <text x="${PX+24}" y="${PY+38}" font-family="Segoe UI, Arial" font-size="20" font-weight="800" fill="${C.text}">${esc(title)}</text>`;
}

// ---------- TEMPLATE: heatmap ----------
function tHeatmap(){
  const cols=14, rows=9, cw=(PW-48)/cols, ch=(PH-80)/rows;
  let cells="";
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const v=Math.sin(r*0.9+c*0.5)+Math.cos(c*0.7-r*0.3);
    const pos=v>=0;
    const inten=Math.min(1,Math.abs(v)/2);
    const col=pos?C.blue:C.amber;
    cells+=`<rect x="${PX+24+c*cw}" y="${PY+64+r*ch}" width="${cw-2}" height="${ch-2}" fill="${col}" opacity="${0.12+inten*0.7}"/>`;
  }
  // white price line
  let path=`M ${PX+24} ${PY+64+ch*5}`;
  for(let c=1;c<=cols;c++){ const y=PY+64+ch*(5+2*Math.sin(c*0.6)); path+=` L ${PX+24+c*cw} ${y}`;}
  const line=`<path d="${path}" fill="none" stroke="#ffffff" stroke-width="3"/>`;
  // wall tags
  const tags=`
    <g font-family="Segoe UI, Arial" font-weight="800" font-size="14">
      <rect x="${PX+PW-150}" y="${PY+64+ch*1-12}" width="126" height="24" rx="4" fill="${C.green}"/>
      <text x="${PX+PW-142}" y="${PY+64+ch*1+5}" fill="#04121a">CALL WALL 7520</text>
      <rect x="${PX+PW-150}" y="${PY+64+ch*7-12}" width="126" height="24" rx="4" fill="${C.red}"/>
      <text x="${PX+PW-142}" y="${PY+64+ch*7+5}" fill="#fff">PUT WALL 7475</text>
      <rect x="${PX+24}" y="${PY+64+ch*5-12}" width="86" height="24" rx="4" fill="${C.cyan}"/>
      <text x="${PX+30}" y="${PY+64+ch*5+5}" fill="#04121a">FLIP 7482</text>
    </g>`;
  return panel("LIVE GEX HEATMAP · ES CANDLES")+cells+line+tags;
}

// ---------- TEMPLATE: gamma bars ----------
function tGamma(){
  const n=26, bw=(PW-60)/n, base=PY+PH/2+20;
  let bars="";
  for(let i=0;i<n;i++){
    const v=Math.sin(i*0.55)*Math.cos(i*0.2)* (i>n*0.55? -1:1);
    const h=(v*140);
    const up=h>=0;
    bars+=`<rect x="${PX+30+i*bw}" y="${up?base-h:base}" width="${bw-3}" height="${Math.abs(h)}" fill="${up?C.blue:C.amber}" opacity="0.9"/>`;
  }
  const flip=`<line x1="${PX+30}" y1="${base}" x2="${PX+PW-30}" y2="${base}" stroke="${C.cyan}" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="${PX+PW-30}" y="${base-10}" text-anchor="end" font-family="Segoe UI, Arial" font-size="16" font-weight="800" fill="${C.cyan}">GAMMA FLIP</text>
    <text x="${PX+40}" y="${PY+90}" font-family="Segoe UI, Arial" font-size="16" font-weight="700" fill="${C.blue}">+ POSITIVE / MEAN REVERT</text>
    <text x="${PX+40}" y="${PY+PH-24}" font-family="Segoe UI, Arial" font-size="16" font-weight="700" fill="${C.amber}">− NEGATIVE / TREND</text>`;
  return panel("NET GEX BY STRIKE")+bars+flip;
}

// ---------- TEMPLATE: levels ladder ----------
function tLevels(){
  const x0=PX+24,x1=PX+PW-24;
  const lvls=[["CALL WALL","7,520",C.green,PY+120],
              ["FLIP","7,482",C.cyan,PY+300],
              ["PUT WALL","7,475",C.red,PY+430]];
  let lines="";
  for(const [n,v,col,y] of lvls){
    lines+=`<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${col}" stroke-width="2" stroke-dasharray="10 6" opacity=".9"/>
      <rect x="${x0}" y="${y-14}" width="150" height="26" rx="4" fill="${col}"/>
      <text x="${x0+10}" y="${y+5}" font-family="Segoe UI, Arial" font-size="14" font-weight="800" fill="${col===C.cyan||col===C.green?'#04121a':'#fff'}">${n} ${v}</text>`;
  }
  // candles
  let cndl="";
  let py=PY+320;
  for(let i=0;i<22;i++){
    const cx=x0+70+i*30;
    const o=py, cch=(Math.sin(i*0.7)*60);
    const cl=o-cch; const up=cl<o;
    const top=Math.min(o,cl)-Math.abs(Math.cos(i)*18);
    const bot=Math.max(o,cl)+Math.abs(Math.sin(i*1.3)*18);
    const col=up?C.green:C.red;
    cndl+=`<line x1="${cx}" y1="${top}" x2="${cx}" y2="${bot}" stroke="${col}" stroke-width="2"/>
      <rect x="${cx-6}" y="${Math.min(o,cl)}" width="12" height="${Math.max(6,Math.abs(cch))}" fill="${col}"/>`;
    py=cl;
    if(py<PY+150)py=PY+300; if(py>PY+430)py=PY+320;
  }
  return panel("KEY LEVELS · SPX")+cndl+lines;
}

// ---------- TEMPLATE: bullseye / confidence ----------
function tBullseye(){
  const cx=PX+180, cy=PY+PH/2+10;
  let rings="";
  const cols=[C.border,"#1a3a2a",C.green];
  [150,100,55].forEach((r,i)=>{rings+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${cols[i]}" stroke-width="10" opacity=".8"/>`;});
  rings+=`<circle cx="${cx}" cy="${cy}" r="16" fill="${C.green}"/>`;
  rings+=`<text x="${cx}" y="${cy-170}" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" font-weight="800" fill="${C.muted}">CB CORE BULLSEYE</text>`;
  const cards=[["9:45","67%"],["10:30","67%"],["12:00","67%"]];
  let cc="";
  cards.forEach(([t,p],i)=>{
    const bx=PX+380, by=PY+70+i*150;
    cc+=`<rect x="${bx}" y="${by}" width="360" height="128" rx="10" fill="${C.panel2}" stroke="${C.border}"/>
      <text x="${bx+22}" y="${by+42}" font-family="Segoe UI, Arial" font-size="22" font-weight="700" fill="${C.text}">${t}</text>
      <text x="${bx+22}" y="${by+96}" font-family="Segoe UI, Arial" font-size="56" font-weight="800" fill="${C.green}">${p}</text>
      <text x="${bx+180}" y="${by+96}" font-family="Segoe UI, Arial" font-size="18" font-weight="600" fill="${C.muted}">HIT RATE · 4/6</text>`;
  });
  return panel("CONFIDENCE · 7-DAY HIT RATE")+rings+cc;
}

// ---------- TEMPLATE: EM tracker ----------
function tEM(){
  const rows=[["SPX","±58",C.cyan],["SPY","±5.8",C.blue],["QQQ","±6.4",C.blue],
    ["NVDA","±7.2",C.green],["TSLA","±14",C.amber],["AAPL","±4.1",C.blue],["META","±22",C.red]];
  let r="";
  rows.forEach((row,i)=>{
    const y=PY+70+i*66;
    const w=80+Math.abs(Math.sin(i))*380;
    r+=`<text x="${PX+24}" y="${y+30}" font-family="Segoe UI, Arial" font-size="22" font-weight="800" fill="${C.text}">${row[0]}</text>
      <rect x="${PX+130}" y="${y+8}" width="${w}" height="28" rx="6" fill="${row[2]}" opacity=".55"/>
      <text x="${PX+PW-24}" y="${y+30}" text-anchor="end" font-family="Segoe UI, Arial" font-size="20" font-weight="800" fill="${row[2]}">${row[1]}</text>`;
  });
  return panel("ESTIMATED MOVE TRACKER · 380+ TICKERS")+r;
}

// ---------- TEMPLATE: flow tape ----------
function tFlow(){
  const rows=[["SPX 7480C","BUY","1,240",C.green],["SPX 7475P","SELL","880",C.red],
    ["SPX 7500C","BUY","2,110",C.green],["SPX 7460P","BUY","640",C.green],
    ["SPX 7520C","SELL","1,530",C.red],["SPX 7450P","SELL","410",C.red],
    ["SPX 7490C","BUY","3,020",C.green]];
  let r="";
  rows.forEach((row,i)=>{
    const y=PY+64+i*54;
    r+=`<rect x="${PX+24}" y="${y}" width="${PW-48}" height="44" rx="6" fill="${C.panel2}"/>
      <text x="${PX+40}" y="${y+29}" font-family="Segoe UI, Arial" font-size="19" font-weight="700" fill="${C.text}">${row[0]}</text>
      <rect x="${PX+300}" y="${y+11}" width="66" height="22" rx="4" fill="${row[3]}"/>
      <text x="${PX+333}" y="${y+27}" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="800" fill="${row[1]==='BUY'?'#04121a':'#fff'}">${row[1]}</text>
      <text x="${PX+PW-40}" y="${y+29}" text-anchor="end" font-family="Segoe UI, Arial" font-size="19" font-weight="800" fill="${row[3]}">${row[2]}×</text>`;
  });
  // net premium sparkline
  let p=`M ${PX+24} ${PY+PH-30}`;
  for(let i=1;i<=20;i++)p+=` L ${PX+24+i*((PW-48)/20)} ${PY+PH-30-(20+i*4+Math.sin(i)*14)}`;
  r+=`<path d="${p}" fill="none" stroke="${C.cyan}" stroke-width="3"/>
     <text x="${PX+24}" y="${PY+PH-6}" font-family="Segoe UI, Arial" font-size="14" font-weight="700" fill="${C.muted}">NET PREMIUM ▲ session</text>`;
  return panel("LIVE OPTIONS FLOW TAPE")+r;
}

function buildSVG(p){
  const inner = TPL[p.tpl]() + headline(p.big, p.small, p.accent);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${frame(inner)}</svg>`;
}

// render gallery
const wrap=document.getElementById("wrap");
POSTS.forEach(p=>{
  const card=document.createElement("div");
  card.className="card";
  card.innerHTML=`
    <div class="bar">
      <div class="lbl">Post <b>#${p.n}</b> · ${p.tpl}</div>
      <button data-n="${p.n}">⬇ Download PNG</button>
    </div>
    <div class="frame" id="frame${p.n}">${buildSVG(p)}</div>
    <div class="copy">${esc(p.copy)}</div>`;
  wrap.appendChild(card);
  card.querySelector("button").onclick=()=>downloadOne(p.n);
});

function svgEl(n){return document.querySelector(`#frame${n} svg`);}
function downloadOne(n){
  const svg=svgEl(n);
  const data=new XMLSerializer().serializeToString(svg);
  const img=new Image();
  const url="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(data)));
  img.onload=()=>{
    const s=2; // 2x → 3200x1800 crisp
    const cv=document.createElement("canvas");
    cv.width=W*s; cv.height=H*s;
    const ctx=cv.getContext("2d");
    ctx.fillStyle="#05070d"; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.drawImage(img,0,0,cv.width,cv.height);
    cv.toBlob(b=>{
      const a=document.createElement("a");
      a.href=URL.createObjectURL(b);
      a.download=`cbedge-post-${String(n).padStart(2,"0")}.png`;
      a.click();
    },"image/png");
  };
  img.src=url;
}
function downloadAll(){ POSTS.forEach((p,i)=>setTimeout(()=>downloadOne(p.n), i*450)); }
