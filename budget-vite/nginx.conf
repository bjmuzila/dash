server {
    listen 8083;
    server_name budget.cbedge.net;
    root /usr/share/nginx/html;
    index index.html;

    # Statement/receipt imports POST as base64 in the JSON body (the budget
    # parse-statement path caps a PDF at 25MB client-side, ~34MB encoded).
    # nginx's 1m default would 413 them. Same value owner-vite uses.
    client_max_body_size 40m;

    # Resolve the backend through Docker's embedded DNS at request time, so
    # nginx boots even when the dashboard container is momentarily down instead
    # of crash-looping on "host not found in upstream". Port must match PORT in
    # .env.local (this deploy = 3002).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $up dashboard:3002;

    # SPA client-side routing: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Everything the household app needs from the backend. NOTE this is
    # intentionally narrower than owner-vite's block: only /api is proxied.
    # budget.cbedge.net has no reason to reach /proxy (TastyTrade/ThetaData
    # market data) or /ws (the GEX feed), and not proxying them means a bug in
    # this app can never touch the trading stack.
    location /api {
        proxy_pass http://$up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Statement parsing runs a multi-page PDF through Claude — well past
        # nginx's 60s default before the first byte.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Auth endpoints must never be cached anywhere in front of the app. The
    # backend already sends no-store; this is belt-and-braces against a
    # Cloudflare rule ever deciding /api/hh/auth/me looks cacheable.
    location /api/hh/auth {
        proxy_pass http://$up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Hashed build assets — cache hard (Vite fingerprints filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # This is a private household app. Keep it out of every index.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
}
