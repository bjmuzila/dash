server {
    listen 8082;
    server_name owner.cbedge.net;
    root /usr/share/nginx/html;
    index index.html;

    # Newsletter idea screenshots POST as base64 in the JSON body — nginx's
    # 1m default would 413 them. Client downscales to ~<1MB; this leaves room.
    client_max_body_size 12m;

    # Resolve the backend via Docker's embedded DNS at request time (lazy), so
    # nginx starts even if the dashboard container is momentarily down and never
    # crash-loops on "host not found in upstream". Port must match PORT in
    # .env.local (this deploy = 3002).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $up dashboard:3002;

    # SPA client-side routing: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Data + assets that must hit the Next backend.
    location ~ ^/(api|proxy|signals\.txt|landing-bg\.png|cb-edge-logo\.png) {
        proxy_pass http://$up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Dashboard chart pages embedded by Day-Posts visual capture. html2canvas
    # reads the iframe's contentDocument, so they MUST be same-origin — proxy
    # them (and their Next /_next assets) to the backend instead of letting the
    # SPA fallback swallow them. /gex is the standalone GEX chart route (its
    # page redirects to / unless ?embed=1, so humans hitting owner /gex still bounce).
    location ~ ^/(flow|options-chain|mult-greek|es-candles|gex|_next)(/|$) {
        proxy_pass http://$up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Live GEX websocket (/ws/gex).
    location /ws {
        proxy_pass http://$up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed build assets — cache hard (Vite fingerprints filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
