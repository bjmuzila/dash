server {
    listen 8086;
    server_name daily.cbedge.net;
    root /usr/share/nginx/html;
    index index.html;

    # Nothing here uploads a file. 2m is headroom for a fat JSON body, not an
    # invitation — the private household app needs 40m only because it accepts
    # base64 PDF bank statements, and this one deliberately does not.
    client_max_body_size 2m;

    # Resolve the backend through Docker's embedded DNS at request time, so nginx
    # boots even when the daily container is momentarily down instead of
    # crash-looping on "host not found in upstream".
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $up daily-api:3011;

    # SPA client-side routing: unknown paths fall back to index.html. That is
    # what makes /pricing, /terms and /join?token=… work on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Everything this app needs from the backend, and nothing else. Deliberately
    # narrower than the owners service: daily.cbedge.net has no reason to reach
    # /proxy (TastyTrade/ThetaData market data) or /ws (the GEX feed), and not
    # proxying them means a bug in this app — the one CB Edge surface a paying
    # stranger is invited to load — can never touch the trading stack.
    location /api {
        proxy_pass http://$up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Google's token endpoint and Stripe are both external round trips inside
        # a request; 60s past nginx's default keeps a slow upstream from being
        # reported to the customer as our failure.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Auth endpoints must never be cached anywhere in front of the app. The
    # backend already sends no-store; this is belt-and-braces against a
    # Cloudflare rule ever deciding /api/daily/auth/me looks cacheable.
    location /api/daily/auth {
        proxy_pass http://$up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # The Stripe webhook. Its own block for two reasons that both matter:
    #
    #   1. proxy_request_buffering must stay ON (the default) so the body
    #      arrives whole — the signature covers the raw bytes and a chunked
    #      hand-off would break verification intermittently, which is the worst
    #      kind of broken.
    #   2. Stripe gives up after ~10s per attempt. A long read timeout here just
    #      means we hold a connection Stripe has already abandoned, so it is
    #      kept short on purpose and the handler is written to be fast.
    location = /api/daily/stripe/webhook {
        proxy_pass http://$up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }

    # Hashed build assets — cache hard (Vite fingerprints filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # UNLIKE budget.cbedge.net, this app WANTS to be found. The private one
    # serves Disallow:/ because it is nobody's business; this one is a product
    # with a landing page, and hiding it from search would be a strange thing to
    # do to something you are trying to sell. The signed-in app is behind a
    # login and a paywall, so there is nothing there for a crawler to reach.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nAllow: /\nDisallow: /api/\nSitemap: https://daily.cbedge.net/sitemap.xml\n";
    }

    location = /sitemap.xml {
        add_header Content-Type application/xml;
        return 200 '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>https://daily.cbedge.net/</loc></url><url><loc>https://daily.cbedge.net/pricing</loc></url><url><loc>https://daily.cbedge.net/terms</loc></url><url><loc>https://daily.cbedge.net/privacy</loc></url></urlset>';
    }
}
