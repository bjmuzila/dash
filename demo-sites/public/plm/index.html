<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PLM Photography — Preview</title>
<style>
  :root { --bg:#faf8f5; --fg:#1f1d1a; --muted:#6b665f; --line:#e6e1d9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151412; --fg:#f2efe9; --muted:#a39d93; --line:#2c2a26; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px;
         background:var(--bg); color:var(--fg);
         font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:560px; text-align:center; }
  .tag { display:inline-block; font-size:12px; letter-spacing:.12em; text-transform:uppercase;
         color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:4px 12px; }
  h1 { font-family:Georgia, "Times New Roman", serif; font-weight:400; font-size:clamp(32px,6vw,48px);
       margin:20px 0 8px; }
  p { color:var(--muted); margin:0 0 8px; }
</style>
</head>
<body>
<main>
  <span class="tag">Private preview</span>
  <h1>PLM Photography</h1>
  <p>Real estate photography — site preview in progress.</p>
  <p>This page is not public and is not indexed by search engines.</p>
</main>
</body>
</html>
