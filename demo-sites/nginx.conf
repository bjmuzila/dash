# sites.cbedge.net — password-protected client demo sites.
#
# Served by the demo-sites compose service (nginx:alpine, 127.0.0.1:8090),
# reached only through the Cloudflare Tunnel.
#
# GENERIC — no per-client blocks. A client is:
#   /opt/demo-sites-data/<slug>/index.html     (their pages)  → /usr/share/nginx/html/<slug>/
#   /opt/demo-sites-auth/<slug>.htpasswd       (their logins) → /etc/nginx/auth/<slug>.htpasswd
# and https://sites.cbedge.net/<slug>/ serves the first behind the second.
# Both are created and edited from owner.cbedge.net → Client Sites
# (server-v2/client-sites.js). Adding a client never touches this file and
# never needs a restart.
#
# Fail-closed rules:
#   - no <slug>.htpasswd file  → 404, even if the folder exists. Pages are
#     never served without a login.
#   - "/" and anything that is not /<slug>/... → plain 404. No directory
#     listing, no list of clients.
#   - dotfiles → 404.
# The slug pattern must match SLUG_RE in server-v2/client-sites.js.

# Visit log for the Client Sites page's view counts (server-v2/client-sites.js
# reads it). One JSON line per request. ip = CF-Connecting-IP, because behind
# the tunnel $remote_addr is only the Docker gateway. u = the login used (also
# filled on a failed attempt). Host folder: /opt/demo-sites-logs.
log_format sites escape=json
    '{"t":"$time_iso8601","ip":"$http_cf_connecting_ip","u":"$remote_user",'
    '"m":"$request_method","p":"$uri","s":$status,'
    '"ua":"$http_user_agent","c":"$http_cf_ipcountry"}';

server {
    listen 80 default_server;

    access_log /var/log/demo-sites/access.log sites;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    autoindex off;
    server_tokens off;
    # Redirects stay relative so they survive the tunnel (host/port/scheme
    # nginx sees are the loopback ones, not sites.cbedge.net).
    absolute_redirect off;

    # Every response, including 401/404. Do not add add_header inside a
    # location block — nginx would drop these server-level headers there.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    # A replaced page shows up on the next refresh, not after a browser cache expires.
    add_header Cache-Control "no-store" always;

    # robots.txt comes from the repo (demo-sites/public/robots.txt).
    location = /robots.txt {
        root /usr/share/nginx/robots;
    }

    location = / {
        return 404;
    }

    # Dotfiles anywhere — never served.
    location ~ /\. {
        return 404;
    }

    # /<slug> → /<slug>/ (only for clients that exist).
    location ~ "^/(?<client>[a-z0-9][a-z0-9-]{0,39})$" {
        if (!-f /etc/nginx/auth/$client.htpasswd) {
            return 404;
        }
        return 301 /$client/;
    }

    # /<slug>/... → that client's files, behind that client's logins.
    location ~ "^/(?<client>[a-z0-9][a-z0-9-]{0,39})/" {
        if (!-f /etc/nginx/auth/$client.htpasswd) {
            return 404;
        }
        auth_basic "Private preview";
        auth_basic_user_file /etc/nginx/auth/$client.htpasswd;
        try_files $uri $uri/ =404;
    }

    location / {
        return 404;
    }
}
