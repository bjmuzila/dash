# sites.cbedge.net — password-protected client demo sites.
#
# Served by the demo-sites compose service (nginx:alpine, 127.0.0.1:8090),
# reached only through the Cloudflare Tunnel.
#
# One folder per client under demo-sites/public/<client>/, one location block
# here, one htpasswd file on the VPS at /opt/demo-sites-auth/<client>.htpasswd
# (mounted read-only at /etc/nginx/auth). Password files never go in git.
#
# Adding a client:
#   1. demo-sites/public/<client>/index.html
#   2. copy the PLM pair of location blocks below, rename plm -> <client>
#   3. on the VPS:  sudo htpasswd -cB /opt/demo-sites-auth/<client>.htpasswd <user>
#
# Anything not explicitly listed here is a 404: there is no directory listing
# and no index of clients at "/", and a folder dropped into public/ without a
# location block is NOT served (so it can never go live without a password).

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    autoindex off;
    server_tokens off;
    # Redirects stay relative so they survive the tunnel (host/port/scheme
    # nginx sees are the loopback ones, not sites.cbedge.net).
    absolute_redirect off;

    # Every response, including 401/404. Do not add add_header inside a
    # location block — nginx would drop these server-level headers there.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /robots.txt {
        try_files /robots.txt =404;
    }

    # Root and everything unlisted: plain 404, no listing, no client list.
    location = / {
        return 404;
    }
    location / {
        return 404;
    }

    # ---- PLM Photography ------------------------------------------------
    location = /plm {
        return 301 /plm/;
    }
    location /plm/ {
        auth_basic "PLM Photography preview";
        auth_basic_user_file /etc/nginx/auth/plm.htpasswd;
        try_files $uri $uri/ =404;
    }
}
