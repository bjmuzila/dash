<title>CB Edge — Owner Console (Demo)</title>
<style>/* ─────────────────────────────────────────────────────────────
   CB Edge Owner Console — DEMO build
   Colors/spacing mirror owner-vite/src/lib/theme.ts (OWNER_THEME).
   ───────────────────────────────────────────────────────────── */
:root{
  --bg:#05060A; --panel:rgba(13,17,25,0.45); --panelSolid:#0D1119; --panelHover:#16181f;
  --inset:rgba(0,0,0,0.30);
  --line:rgba(255,255,255,0.10); --lineStrong:rgba(255,255,255,0.18);
  --tx:#FFFFFF;
  --cy:#219EBC; --purple:#126783; --orange:#FB8501; --gold:#FFB703;
  --green:#8ECAE6; --lblue:#7dd3fc; --red:#EF4444; --softred:#f4948e;
  --ok:#4ade80;
  --rail:280px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--tx);
  background-image:
    radial-gradient(circle at 15% 50%, rgba(33,158,188,0.04) 0%, transparent 50%),
    radial-gradient(circle at 85% 30%, rgba(18,103,131,0.05) 0%, transparent 50%);
  font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
a{color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ── demo banner ── */
#demobar{
  position:fixed; inset:0 0 auto 0; height:30px; z-index:80;
  display:flex; align-items:center; justify-content:center; gap:10px;
  background:linear-gradient(90deg, rgba(251,133,1,.16), rgba(255,183,3,.16));
  border-bottom:1px solid rgba(255,183,3,.32);
  font-size:11px; letter-spacing:.06em; color:#FFD98A;
}
#demobar b{color:#FFB703; font-weight:800; letter-spacing:.14em; text-transform:uppercase; font-size:10px}
#demobar span{opacity:.85}

/* ── shell ── */
#shell{position:fixed; inset:30px 0 0 0; display:flex; min-height:0}

/* rail */
#rail{
  width:var(--rail); flex:0 0 var(--rail); height:100%; overflow-y:auto;
  background:#040507; border-right:1px solid var(--line); padding:16px 12px 32px;
}
.brand{display:flex; align-items:center; gap:10px; padding:6px 8px 16px; border-bottom:1px solid var(--line); margin-bottom:12px}
.brand .mark{width:28px;height:28px;border-radius:8px;flex:0 0 28px;
  background:linear-gradient(135deg,var(--cy),var(--purple));
  display:grid;place-items:center;font-weight:900;font-size:13px;color:#04212a}
.brand .nm{font-weight:800;font-size:15px;letter-spacing:-.01em;line-height:1.1}
.brand .sb{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.4;font-weight:700}

.railsearch{position:relative; margin:0 4px 14px}
.railsearch input{
  width:100%; background:var(--inset); border:1px solid var(--line); border-radius:9px;
  color:var(--tx); font:inherit; font-size:12.5px; padding:8px 10px 8px 30px; outline:none;
}
.railsearch input:focus{border-color:rgba(33,158,188,.55)}
.railsearch .ic{position:absolute; left:10px; top:8px; opacity:.35; font-size:12px}

.rgroup{margin:14px 4px 0}
.rgroup .lab{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;
  opacity:.45;padding:0 8px 6px;display:flex;justify-content:space-between;align-items:center}
.rlink{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:9px;cursor:pointer;
  border:1px solid transparent;font-size:13px;line-height:1.25}
.rlink .gl{width:16px;text-align:center;opacity:.55;font-size:12.5px;flex:0 0 16px}
.rlink:hover{background:var(--panelHover)}
.rlink.on{background:var(--panelSolid);border-color:var(--lineStrong)}
.rlink.on .gl{opacity:1}
.rlink .lk{font-size:9px;opacity:.35;margin-left:auto;letter-spacing:.1em}

/* main */
#main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column}
#toolbar{
  display:flex;align-items:center;gap:12px;padding:12px 20px;flex-shrink:0;
  background:var(--panel);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);
}
#toolbar .ttl{font-size:15px;font-weight:800;letter-spacing:-.01em}
#toolbar .crumb{font-size:11px;opacity:.35;letter-spacing:.06em}
#toolbar .sp{flex:1}
.tbtn{border:1px solid var(--line);background:var(--inset);color:var(--tx);border-radius:8px;
  padding:6px 11px;font:inherit;font-size:11.5px;cursor:pointer;opacity:.85}
.tbtn:hover{border-color:var(--lineStrong);opacity:1}
.tbtn.on{border-color:rgba(33,158,188,.6);color:#8fdcef}
.livedot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 0 3px rgba(74,222,128,.15);margin-right:6px;vertical-align:1px}
#clock{font-size:11.5px;opacity:.5;font-variant-numeric:tabular-nums}

#view{flex:1;min-height:0;overflow-y:auto;padding:22px 24px 64px}
.page{max-width:1240px;margin:0 auto}

/* ── page header ── */
.phead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.phead h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.phead .sub{font-size:12.5px;opacity:.45;margin:0}
.phead .sp{flex:1}

/* ── cards ── */
.card{background:var(--panel);backdrop-filter:blur(16px);border:1px solid var(--line);
  border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.22);padding:16px 18px;margin-bottom:16px}
.card > .ch{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card > .ch .t{font-size:15px;font-weight:700;letter-spacing:-.005em}
.card > .ch .s{font-size:11.5px;opacity:.4}
.card > .ch .sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid2 > .card,.grid3 > .card{margin-bottom:0}
@media(max-width:1100px){.grid2,.grid3{grid-template-columns:1fr}}

/* ── tiles ── */
.tiles{display:grid;gap:10px;margin-bottom:16px}
.tile{background:var(--panelSolid);border:1px solid var(--line);border-radius:14px;padding:13px 15px;position:relative;overflow:hidden}
.tile .l{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.42;font-weight:700}
.tile .n{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums}
.tile .d{font-size:11px;margin-top:3px;opacity:.5}
.tile .d.up{color:var(--ok);opacity:.9} .tile .d.dn{color:var(--softred);opacity:.9}
.tile svg.sp{position:absolute;right:0;bottom:0;opacity:.5}

/* ── tables ── */
.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
th{text-align:left;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.4;
  font-weight:800;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.045);vertical-align:middle;white-space:nowrap}
tbody tr:hover td{background:rgba(255,255,255,.02)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.mut{opacity:.45} .pos{color:var(--ok)} .neg{color:var(--softred)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}

/* ── pills / chips ── */
.pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;padding:2.5px 8px;
  border-radius:20px;border:1px solid;white-space:nowrap}
.p-cy{color:var(--cy);border-color:rgba(33,158,188,.45);background:rgba(33,158,188,.1)}
.p-gd{color:var(--gold);border-color:rgba(255,183,3,.4);background:rgba(255,183,3,.09)}
.p-og{color:var(--orange);border-color:rgba(251,133,1,.4);background:rgba(251,133,1,.09)}
.p-gn{color:var(--ok);border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.08)}
.p-rd{color:var(--softred);border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08)}
.p-mt{opacity:.5;border-color:var(--line);background:var(--inset)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* ── misc bits ── */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--inset)}
.seg button{border:0;background:transparent;color:var(--tx);font:inherit;font-size:11.5px;
  padding:6px 12px;cursor:pointer;opacity:.5}
.seg button.on{background:rgba(33,158,188,.16);color:#8fdcef;opacity:1}
.bar{height:5px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.045);font-size:12.5px}
.kv:last-child{border-bottom:0}
.kv .k{opacity:.45}
.note{border-left:2px solid var(--cy);padding:4px 0 4px 12px;font-size:12px;opacity:.6;margin:12px 0 0}
.empty{padding:34px;text-align:center;opacity:.35;font-size:12.5px}
.synth{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;color:#FFD98A;
  border:1px solid rgba(255,183,3,.3);background:rgba(255,183,3,.07);border-radius:7px;
  padding:5px 10px;margin-bottom:14px}
.locked{display:grid;place-items:center;min-height:340px;text-align:center;gap:8px}
.locked .lk{font-size:30px;opacity:.25}
.locked .t{font-size:16px;font-weight:700}
.locked .s{font-size:12.5px;opacity:.45;max-width:420px}

/* ladder (ΔGEX) */
.ladder{display:flex;flex-direction:column;gap:2px;font-size:11px}
.ladder{position:relative}
.ladder::before{content:"";position:absolute;left:calc(56px + 8px + ((100% - 56px - 96px - 24px)/2));
  top:0;bottom:0;width:1px;background:rgba(255,255,255,.10)}
.rung{display:grid;grid-template-columns:56px 1fr 1fr 96px;align-items:center;gap:8px;height:19px}
.rung .k{opacity:.5;font-variant-numeric:tabular-nums;text-align:right}
.rung .lft,.rung .rgt{height:11px;position:relative}
.rung .lft i{position:absolute;right:0;top:0;height:100%;border-radius:2px 0 0 2px;background:var(--softred);opacity:.75}
.rung .rgt i{position:absolute;left:0;top:0;height:100%;border-radius:0 2px 2px 0;background:var(--green);opacity:.75}
.rung.hi{background:rgba(255,183,3,.07);border-radius:4px}
.rung .tagx{font-size:9px;opacity:.55;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* gauges */
.gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:900px){.gauges{grid-template-columns:repeat(2,1fr)}}
.gauge{background:var(--panelSolid);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.gauge .gl{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.42;font-weight:700}
.gauge .gv{font-size:17px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}

/* map */
.mapwrap{position:relative;background:var(--inset);border:1px solid var(--line);border-radius:14px;overflow:hidden}

/* rail scroll on small screens */
@media(max-width:940px){
  :root{--rail:0px}
  #rail{position:fixed;left:0;top:30px;bottom:0;width:270px;flex-basis:270px;z-index:60;transform:translateX(-100%);transition:transform .18s}
  body.railopen #rail{transform:none}
  #shell{display:block}
  #main{height:100%}
}
.mtoggle{display:none}
@media(max-width:940px){.mtoggle{display:inline-block}}
</style>
</head>

/* ── tiny render helpers ─────────────────────────────────── */
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = n => (n<0?"-":"") + "$" + Math.abs(n).toLocaleString();
const pct = n => (n>0?"+":"") + (n*100).toFixed(0) + "%";

function card(title, body, opts={}){
  const s = opts.sub ? `<span class="s">${esc(opts.sub)}</span>` : "";
  const r = opts.right || "";
  const head = title ? `<div class="ch"><span class="t">${esc(title)}</span>${s}<span class="sp"></span>${r}</div>` : "";
  return `<div class="card">${head}${body}</div>`;
}

function tiles(list, cols){
  const c = cols || Math.min(list.length, 6);
  const items = list.map(t=>{
    const d = t.d ? `<div class="d ${t.up===true?"up":t.up===false?"dn":""}">${esc(t.d)}</div>` : "";
    const sp = t.s ? spark(t.s, t.up===false?"var(--softred)":"var(--cy)") : "";
    return `<div class="tile"><div class="l">${esc(t.l)}</div><div class="n">${esc(t.n)}</div>${d}${sp}</div>`;
  }).join("");
  return `<div class="tiles" style="grid-template-columns:repeat(${c},minmax(0,1fr))">${items}</div>`;
}

function spark(vals, color){
  const w=110,h=30, mn=Math.min(...vals), mx=Math.max(...vals), rg=(mx-mn)||1;
  const pts = vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-2-((v-mn)/rg)*(h-6)).toFixed(1)}`).join(" ");
  return `<svg class="sp" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" opacity=".8"/></svg>`;
}

function lineChart(series, opts={}){
  const w=opts.w||760, h=opts.h||190, pad=26;
  const all = series.flatMap(s=>s.v);
  const mn = opts.zero ? 0 : Math.min(...all), mx = Math.max(...all), rg=(mx-mn)||1;
  const n = series[0].v.length;
  const X = i => pad + (i/(n-1))*(w-pad*2);
  const Y = v => h-pad - ((v-mn)/rg)*(h-pad*2);
  const grid = [0,.25,.5,.75,1].map(f=>{
    const y = h-pad - f*(h-pad*2);
    return `<line x1="${pad}" x2="${w-pad}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,.06)"/>
      <text x="4" y="${(y+3).toFixed(1)}" font-size="9" fill="rgba(255,255,255,.3)">${Math.round(mn+f*rg).toLocaleString()}</text>`;
  }).join("");
  const paths = series.map(s=>{
    const d = s.v.map((v,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
    const area = `${d} L${X(n-1).toFixed(1)},${h-pad} L${X(0).toFixed(1)},${h-pad} Z`;
    return `${s.fill?`<path d="${area}" fill="${s.c}" opacity=".10"/>`:""}
      <path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"/>`;
  }).join("");
  const labs = (opts.x||[]).map((t,i)=>`<text x="${X(i).toFixed(1)}" y="${h-8}" font-size="9"
    fill="rgba(255,255,255,.3)" text-anchor="middle">${esc(t)}</text>`).join("");
  const leg = series.length>1 ? `<div class="chips" style="margin-top:8px">`+series.map(s=>
    `<span class="pill p-mt" style="color:${s.c};border-color:${s.c}55">${esc(s.n)}</span>`).join("")+`</div>` : "";
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">${grid}${paths}${labs}</svg>${leg}`;
}

function barChart(rows, opts={}){
  const w=opts.w||760, h=opts.h||200, pad=30, n=rows.length;
  const mx = Math.max(...rows.flatMap(r=>[r.a||0, r.b||0]))||1;
  const bw = (w-pad*2)/n;
  const bars = rows.map((r,i)=>{
    const x = pad + i*bw;
    const ha = ((r.a||0)/mx)*(h-pad*2), hb=((r.b||0)/mx)*(h-pad*2);
    return `<rect x="${(x+bw*0.16).toFixed(1)}" y="${(h-pad-ha).toFixed(1)}" width="${(bw*0.36).toFixed(1)}"
        height="${ha.toFixed(1)}" fill="${opts.ca||"var(--cy)"}" opacity=".85" rx="2"/>
      <rect x="${(x+bw*0.52).toFixed(1)}" y="${(h-pad-hb).toFixed(1)}" width="${(bw*0.30).toFixed(1)}"
        height="${hb.toFixed(1)}" fill="${opts.cb||"var(--orange)"}" opacity=".7" rx="2"/>
      <text x="${(x+bw/2).toFixed(1)}" y="${h-9}" font-size="9" fill="rgba(255,255,255,.32)" text-anchor="middle">${esc(r.m)}</text>`;
  }).join("");
  const base = `<line x1="${pad}" x2="${w-pad}" y1="${h-pad}" y2="${h-pad}" stroke="rgba(255,255,255,.1)"/>`;
  const leg = `<div class="chips" style="margin-top:8px">
    <span class="pill p-cy">${esc(opts.la||"A")}</span><span class="pill p-og">${esc(opts.lb||"B")}</span></div>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">${base}${bars}</svg>${leg}`;
}

function table(cols, rows, opts={}){
  const th = cols.map(c=>`<th class="${c.n?"num":""}">${esc(c.t||c)}</th>`).join("");
  const tb = rows.map(r=>`<tr>${r.map((cell,i)=>{
    const c = cols[i]||{};
    return `<td class="${c.n?"num":""} ${c.cls||""}">${cell}</td>`;
  }).join("")}</tr>`).join("");
  return `<div class="tw"><table>${opts.nohead?"":`<thead><tr>${th}</tr></thead>`}<tbody>${tb}</tbody></table></div>`;
}

function pill(t, k){ return `<span class="pill p-${k||"mt"}">${esc(t)}</span>`; }
function bar(f, color){ return `<div class="bar"><i style="width:${Math.max(2,Math.min(100,f*100)).toFixed(0)}%;background:${color||"var(--cy)"}"></i></div>`; }
function seg(items, active){
  return `<div class="seg">${items.map(i=>`<button class="${i===active?"on":""}">${esc(i)}</button>`).join("")}</div>`;
}
function synth(txt){ return `<div class="synth">◆ ${esc(txt||"All customer records on this screen are synthetic demo data.")}</div>`; }

function gauge(label, value, frac, color){
  const r=34, cx=48, cy=48, C=Math.PI*r;
  const f = Math.max(-1, Math.min(1, frac));
  const len = Math.abs(f)*C*0.5;
  const dir = f>=0 ? 1 : 0;
  return `<div class="gauge">
    <svg viewBox="0 0 96 62" style="width:100%;height:auto">
      <path d="M14,48 A${r},${r} 0 0 1 82,48" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="7" stroke-linecap="round"/>
      <path d="M48,14 A${r},${r} 0 0 ${dir} ${(cx + (dir? 1:-1)*r*Math.sin(Math.abs(f)*Math.PI/2)).toFixed(1)},${(cy - r*Math.cos(Math.abs(f)*Math.PI/2)).toFixed(1)}"
        fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"/>
      <line x1="48" y1="48" x2="48" y2="20" stroke="rgba(255,255,255,.25)" stroke-width="1"/>
    </svg>
    <div class="gl">${esc(label)}</div><div class="gv" style="color:${color}">${esc(value)}</div></div>`;
}

function ladder(rows, spot){
  const mx = Math.max(...rows.flatMap(r=>[Math.abs(r[1]),Math.abs(r[2])]))||1;
  return `<div class="ladder">${rows.map(r=>{
    const [k,prior,now] = r;
    const hi = Math.abs(now)===Math.max(...rows.map(x=>Math.abs(x[2])));
    const neg = now<0;
    const wPrior = Math.abs(prior)/mx*100, wNow = Math.abs(now)/mx*100;
    const delta = now-prior;
    const tag = Math.abs(delta) < 12 ? "" : (now>0
      ? (delta>0 ? "built"   : "eroded")     // positive gamma: added / taken off
      : (delta<0 ? "deepened" : "lifted"));  // negative gamma: more / less negative
    return `<div class="rung ${hi?"hi":""}">
      <div class="k">${k}</div>
      <div class="lft">${neg?`<i style="width:${wNow.toFixed(0)}%"></i><i style="width:${wPrior.toFixed(0)}%;background:transparent;border:1px solid rgba(244,148,142,.5)"></i>`:""}</div>
      <div class="rgt">${!neg?`<i style="width:${wNow.toFixed(0)}%"></i><i style="width:${wPrior.toFixed(0)}%;background:transparent;border:1px solid rgba(142,202,230,.5)"></i>`:""}</div>
      <div class="tagx">${tag?esc(tag):""}${k===spot?" ← spot":""}</div>
    </div>`;
  }).join("")}</div>`;
}

function heat(rows){ /* rows: [[label, [v...]]] */
  const mx = Math.max(...rows.flatMap(r=>r[1]))||1;
  return `<div style="display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:11px">
    ${rows.map(r=>`<div class="mut">${esc(r[0])}</div>
      <div style="display:grid;grid-template-columns:repeat(${r[1].length},1fr);gap:2px">
        ${r[1].map(v=>`<div style="height:14px;border-radius:2px;background:rgba(33,158,188,${(0.08+0.85*v/mx).toFixed(2)})"></div>`).join("")}
      </div>`).join("")}
  </div>`;
}

/* ── rail ────────────────────────────────────────────────── */
function renderRail(active, q){
  const f = (q||"").trim().toLowerCase();
  const match = l => !f || l.label.toLowerCase().includes(f) || l.key.toLowerCase().includes(f);
  const link = l => `<div class="rlink ${l.key===active?"on":""}" data-go="${l.key}">
      <span class="gl">${l.glyph}</span><span>${l.label}</span></div>`;
  const pin = NAV.pinned.filter(match).map(link).join("");
  const groups = NAV.groups.map(g=>{
    const links = g.links.filter(match);
    if(!links.length) return "";
    return `<div class="rgroup"><div class="lab" style="color:${g.accent}">
      <span>${g.label}</span><span style="opacity:.6">${links.length}</span></div>${links.map(link).join("")}</div>`;
  }).join("");
  return `<div class="brand"><div class="mark">CB</div>
      <div><div class="nm">Owner</div><div class="sb">cbedge.net</div></div></div>
    <div class="railsearch"><span class="ic">⌕</span><input id="q" placeholder="Filter routes…" value="${esc(q||"")}"></div>
    ${pin}${groups}`;
}

/* ── router ──────────────────────────────────────────────── */
let ACTIVE = "Hub", QUERY = "";

function go(key){
  if(!P[key]) key = "Hub";
  ACTIVE = key;
  const meta = ALL.find(l=>l.key===key) || {label:key, glyph:"⌂"};
  const grp = NAV.groups.find(g=>g.links.some(l=>l.key===key));
  document.getElementById("rail").innerHTML = renderRail(ACTIVE, QUERY);
  document.getElementById("crumb").textContent = grp ? grp.label : "Pinned";
  document.getElementById("ttl").textContent = meta.label;
  const v = document.getElementById("view");
  v.innerHTML = `<div class="page">${P[key]()}</div>`;
  v.scrollTop = 0;
  document.body.classList.remove("railopen");
  try{ location.hash = "#" + key; }catch(e){}
  wire();
}

function wire(){
  document.querySelectorAll("[data-go]").forEach(el=>{
    el.onclick = () => go(el.getAttribute("data-go"));
  });
  const q = document.getElementById("q");
  if(q){
    q.oninput = e => {
      QUERY = e.target.value;
      document.getElementById("rail").innerHTML = renderRail(ACTIVE, QUERY);
      const nq = document.getElementById("q");
      nq.focus(); nq.setSelectionRange(QUERY.length, QUERY.length);
      wire();
    };
  }
}

function clock(){
  const d = new Date();
  const et = d.toLocaleTimeString("en-US",{timeZone:"America/New_York",hour12:false});
  const el = document.getElementById("clock");
  if(el) el.textContent = et + " ET";
}

window.addEventListener("hashchange", () => {
  const k = location.hash.replace("#","");
  if(k && k !== ACTIVE) go(k);
});

document.addEventListener("keydown", e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){
    e.preventDefault(); const q=document.getElementById("q"); if(q) q.focus();
  }
});

(function init(){
  document.getElementById("menu").onclick = () => document.body.classList.toggle("railopen");
  clock(); setInterval(clock, 1000);
  const k = location.hash.replace("#","");
  go(k && P[k] ? k : "Hub");
})();

</script>
