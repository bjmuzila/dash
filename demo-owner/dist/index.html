<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>CB Edge — Owner Console (Demo)</title>
<style>/* ─────────────────────────────────────────────────────────────
   CB Edge Owner Console — DEMO build
   Chrome ported 1:1 from:
     owner-vite/src/lib/theme.ts       (OWNER_THEME, card + tile styles)
     owner-vite/src/OwnerShell.tsx     (rail: 206px, group heads, link rows)
     owner-vite/src/OwnerToolbar.tsx   (top bar, cyan accent, clock, pills)
     owner-vite/src/components/PageCard.tsx (PageShell + Card)
   ───────────────────────────────────────────────────────────── */
:root{
  --bg:#05060A; --panelBg:rgba(13,17,25,0.45); --panelSolid:#0D1119; --panelHover:#16181f;
  --inset:rgba(0,0,0,0.30);
  --line:rgba(255,255,255,0.10); --lineStrong:rgba(255,255,255,0.18);
  --tx:#FFFFFF;
  --cy:#219EBC; --purple:#126783; --orange:#FB8501; --gold:#FFB703;
  --green:#8ECAE6; --lblue:#7dd3fc; --red:#EF4444; --softred:#f4948e;
  --ok:#1FD98A;
  /* TYPE scale — theme.ts */
  --t-display:30px; --t-title:17px; --t-subhead:15px; --t-body:14px; --t-label:12px; --t-micro:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--tx);
  background-image:
    radial-gradient(circle at 15% 50%, rgba(33,158,188,0.04) 0%, transparent 50%),
    radial-gradient(circle at 85% 30%, rgba(18,103,131,0.05) 0%, transparent 50%);
  font:var(--t-body)/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  letter-spacing:.01em; -webkit-font-smoothing:antialiased; overflow:hidden;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* ── demo banner (not in the real app) ── */
#demobar{
  position:fixed; inset:0 0 auto 0; height:26px; z-index:130;
  display:flex; align-items:center; justify-content:center; gap:9px;
  background:linear-gradient(90deg, rgba(251,133,1,.15), rgba(255,183,3,.15));
  border-bottom:1px solid rgba(255,183,3,.3);
  font-size:10.5px; letter-spacing:.05em; color:#FFD98A;
}
#demobar b{color:var(--gold); font-weight:800; letter-spacing:.14em; text-transform:uppercase; font-size:9.5px}
#demobar span{opacity:.85}

/* ── OwnerToolbar ── */
#shell{position:fixed; inset:26px 0 0 0; display:flex; flex-direction:column; min-height:0}
#toolbar{
  flex-shrink:0; display:flex; align-items:center; gap:10px; padding:7px 14px; position:relative;
  background:radial-gradient(circle at 50% 0%, rgba(33,158,188,.08) 0%, transparent 60%), var(--panelSolid);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
}
#toolbar::before{
  content:""; position:absolute; top:0; left:0; right:0; height:2px; pointer-events:none;
  background:linear-gradient(90deg, transparent 0%, rgba(33,158,188,.12) 15%, rgba(33,158,188,.9) 50%, rgba(33,158,188,.12) 85%, transparent 100%);
  box-shadow:0 0 8px rgba(33,158,188,.35);
}
.tbrand{display:flex; align-items:center; gap:8px; text-decoration:none; cursor:pointer}
.tbrand .logo{height:22px; display:flex; align-items:center; gap:6px;
  font-size:15px; font-weight:900; letter-spacing:-.02em; color:#e8edf5}
.tbrand .logo i{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-style:normal;
  font-size:11px;font-weight:900;color:#04212a;background:linear-gradient(135deg,var(--cy),var(--purple))}
.tbrand .own{font-size:12px; font-weight:800; letter-spacing:.16em; color:var(--cy); text-transform:uppercase}
#toolbar .sp{flex:1}
#tclock{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; font-weight:800;
  color:#e8edf5; font-variant-numeric:tabular-nums; letter-spacing:.05em; white-space:nowrap}
.tpill{font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
  padding:5px 10px; border-radius:7px; text-decoration:none; cursor:pointer;
  color:var(--tx); border:1px solid var(--line); background:rgba(255,255,255,.04)}
.tpill.danger{color:var(--red); border-color:rgba(239,68,68,.3); background:rgba(239,68,68,.08)}
.tmenu{display:none}

/* ── rail (OwnerShell) ── */
#body{display:flex; flex:1; min-height:0; position:relative}
#rail{
  width:206px; flex-shrink:0; display:flex; flex-direction:column; gap:12px;
  padding:14px 10px; overflow-y:auto;
  background:var(--panelSolid); border-right:1px solid var(--line);
}
.rblock{display:flex; flex-direction:column; gap:2px}
.rhead{font-size:11px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; padding:0 7px 2px}
.rrow{position:relative; display:flex; align-items:center}
.rlink{flex:1; min-width:0; display:flex; align-items:center; gap:7px;
  padding:6px 9px; padding-right:26px; border-radius:7px; font-size:13px; font-weight:600;
  text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  color:var(--tx); background:transparent; border:1px solid transparent; cursor:pointer}
.rlink.nostar{padding-right:9px}
.rlink .gl{width:16px; text-align:center; font-size:13px; flex:0 0 16px}
.rstar{position:absolute; right:5px; width:18px; height:18px; display:flex; align-items:center;
  justify-content:center; background:none; border:none; padding:0; cursor:pointer; font-size:12px;
  line-height:1; color:var(--tx); opacity:0; transition:opacity .12s ease}
.rrow:hover .rstar{opacity:.5}
.rstar.on{color:var(--gold); opacity:1}
.rdiv{height:1px; margin:8px 7px 0; background:var(--line)}

/* ── PageShell ── */
#view{flex:1; min-width:0; min-height:0; overflow:auto;
  padding:clamp(14px,2vw,24px); display:flex; flex-direction:column; gap:clamp(16px,2vw,32px)}
.page{display:flex; flex-direction:column; gap:clamp(16px,2vw,32px)}

/* ── Card (PageCard.tsx) ── */
.card{
  background:var(--panelBg); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-radius:18px; border:1px solid var(--line); box-shadow:0 18px 40px rgba(0,0,0,.22);
  padding:24px;
}
.card.tight{padding:16px 18px}
.card > .chead{margin-bottom:16px; display:flex; flex-direction:column; gap:2px}
.card > .chead .ct{font-size:14px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--tx)}
.card > .chead .cs{font-size:12px; color:var(--green)}
.card > .chead .crow{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.card > .chead .crow .sp{flex:1}
.grid2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:clamp(16px,2vw,32px)}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(16px,2vw,32px)}
@media(max-width:1180px){.grid3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media(max-width:980px){.grid2,.grid3{grid-template-columns:1fr}}

/* ── page header row ── */
.phead{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.phead h1{margin:0; font-size:var(--t-title); font-weight:700; letter-spacing:.01em}
.phead .psub{font-size:12px; opacity:.45}
.phead .sp{flex:1}

/* ── stat tiles (statTileStyle: no border, r16, blur20) ── */
.tiles{display:grid; gap:10px}
.tile{background:var(--panelBg); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:none; border-radius:16px; padding:13px 15px; position:relative; overflow:hidden}
.tile .l{font-size:var(--t-micro); letter-spacing:.14em; text-transform:uppercase; opacity:.45; font-weight:800}
.tile .n{font-size:24px; font-weight:800; letter-spacing:-.02em; margin-top:5px; font-variant-numeric:tabular-nums}
.tile .n.sm{font-size:15px; letter-spacing:0}
.tile .d{font-size:11px; margin-top:3px; opacity:.5}
.tile .d.up{color:var(--ok); opacity:.9} .tile .d.dn{color:var(--softred); opacity:.9}
.tile svg.sp{position:absolute; right:0; bottom:0; opacity:.5}

/* ── tables ── */
.tw{overflow-x:auto; margin:0 -6px}
table{width:100%; border-collapse:collapse; font-size:12.5px; min-width:520px}
th{text-align:left; font-size:var(--t-micro); letter-spacing:.12em; text-transform:uppercase; opacity:.45;
  font-weight:800; padding:7px 10px; border-bottom:1px solid var(--line); white-space:nowrap}
td{padding:8px 10px; border-bottom:1px solid rgba(255,255,255,.045); vertical-align:middle; white-space:nowrap}
tbody tr:hover td{background:rgba(255,255,255,.02)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
.mut{opacity:.45} .pos{color:var(--ok)} .neg{color:var(--softred)}

/* ── pills ── */
.pill{display:inline-block; font-size:var(--t-micro); font-weight:700; letter-spacing:.04em;
  padding:2.5px 8px; border-radius:20px; border:1px solid; white-space:nowrap}
.p-cy{color:var(--cy);border-color:rgba(33,158,188,.45);background:rgba(33,158,188,.1)}
.p-gd{color:var(--gold);border-color:rgba(255,183,3,.4);background:rgba(255,183,3,.09)}
.p-og{color:var(--orange);border-color:rgba(251,133,1,.4);background:rgba(251,133,1,.09)}
.p-gn{color:var(--ok);border-color:rgba(31,217,138,.4);background:rgba(31,217,138,.08)}
.p-rd{color:var(--softred);border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08)}
.p-bl{color:var(--lblue);border-color:rgba(125,211,252,.4);background:rgba(125,211,252,.08)}
.p-mt{opacity:.55;border-color:var(--line);background:var(--inset)}
.chips{display:flex; gap:6px; flex-wrap:wrap; align-items:center}

/* ── buttons / inputs (theme.ts) ── */
.btn{padding:10px 14px; border-radius:10px; border:1px solid rgba(33,158,188,.25);
  background:linear-gradient(180deg, rgba(33,158,188,.16), rgba(33,158,188,.05));
  color:var(--cy); font:inherit; font-size:14px; font-weight:800; letter-spacing:.02em; cursor:pointer}
.btn2{padding:10px 14px; border-radius:10px; border:1px solid var(--line);
  background:rgba(255,255,255,.04); color:var(--tx); font:inherit; font-size:14px; font-weight:700;
  letter-spacing:.02em; cursor:pointer}
.btn.sm,.btn2.sm{padding:6px 11px; font-size:12px}
.inp{font-size:14px; padding:10px 12px; border:1px solid var(--line); border-radius:10px;
  background:var(--inset); color:var(--tx); outline:none; width:100%}
.inp.ph{opacity:.38}
.refresh{font-size:10px; padding:2px 10px; border:1px solid rgba(33,158,188,.4); border-radius:2px;
  background:rgba(33,158,188,.08); color:var(--cy); cursor:pointer; font-weight:700}

/* segmented / dock tabs */
.seg{display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--inset)}
.seg button{border:0; background:transparent; color:var(--tx); font:inherit; font-size:11.5px;
  padding:6px 12px; cursor:pointer; opacity:.5; white-space:nowrap}
.seg button.on{background:linear-gradient(180deg, rgba(33,158,188,.16), rgba(33,158,188,.04));
  color:var(--cy); opacity:1; box-shadow:0 0 14px rgba(33,158,188,.22)}

/* ── misc ── */
.bar{height:5px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;
  border-bottom:1px solid rgba(255,255,255,.045);font-size:12.5px}
.kv:last-child{border-bottom:0}
.kv .k{opacity:.45}
.note{border-left:2px solid var(--cy);padding:4px 0 4px 12px;font-size:12px;opacity:.6}
.synth{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;color:#FFD98A;
  border:1px solid rgba(255,183,3,.3);background:rgba(255,183,3,.07);border-radius:7px;padding:5px 10px}
.locked{display:grid;place-items:center;min-height:340px;text-align:center;gap:8px}
.locked .lk{font-size:30px;opacity:.25}
.locked .t{font-size:16px;font-weight:700}
.locked .s{font-size:12.5px;opacity:.45;max-width:420px}

/* ladder */
.ladder{display:flex;flex-direction:column;gap:2px;font-size:11px;position:relative}
.ladder::before{content:"";position:absolute;left:calc(56px + 8px + ((100% - 56px - 96px - 24px)/2));
  top:0;bottom:0;width:1px;background:rgba(255,255,255,.10)}
.rung{display:grid;grid-template-columns:56px 1fr 1fr 96px;align-items:center;gap:8px;height:19px}
.rung .k{opacity:.5;font-variant-numeric:tabular-nums;text-align:right}
.rung .lft,.rung .rgt{height:11px;position:relative}
.rung .lft i{position:absolute;right:0;top:0;height:100%;border-radius:2px 0 0 2px;background:var(--softred);opacity:.75}
.rung .rgt i{position:absolute;left:0;top:0;height:100%;border-radius:0 2px 2px 0;background:var(--green);opacity:.75}
.rung.hi{background:rgba(255,183,3,.07);border-radius:4px}
.rung .tagx{font-size:9px;opacity:.55;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* gauges */
.gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:900px){.gauges{grid-template-columns:repeat(2,1fr)}}
.gauge{background:var(--panelBg);backdrop-filter:blur(20px);border-radius:16px;padding:12px;text-align:center}
.gauge .gl{font-size:var(--t-micro);letter-spacing:.14em;text-transform:uppercase;opacity:.45;font-weight:800}
.gauge .gv{font-size:17px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}

.mapwrap{position:relative;background:var(--inset);border:1px solid var(--line);border-radius:14px;overflow:hidden}

/* mobile — OwnerShell drawer at 820px */
@media(max-width:820px){
  #rail{position:fixed;top:26px;bottom:0;left:0;z-index:120;width:min(78vw,260px);
    transform:translateX(-100%);transition:transform .22s ease;background:rgba(10,13,20,.98);
    backdrop-filter:blur(16px)}
  body.railopen #rail{transform:none;box-shadow:0 0 40px rgba(0,0,0,.6)}
  .tmenu{display:inline-block}
  .grid2,.grid3{grid-template-columns:1fr}
}

/* ── LiveKpiCard ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:12px}
.kpi{position:relative;background:var(--panelBg);backdrop-filter:blur(16px);border:1px solid var(--line);
  border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.22);padding:16px 18px 30px;overflow:hidden}
.kpi .kl{font-size:12px;color:var(--gold);letter-spacing:.07em;text-transform:uppercase;font-weight:800;
  padding-right:56px;line-height:1.3}
.kpi .kv{font-size:30px;font-weight:800;margin-top:8px;letter-spacing:-.02em;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.kpi .ks{font-size:12px;opacity:.5;margin-top:4px}
.kpi .kd{position:absolute;top:15px;right:16px;font-size:11px;font-weight:800;letter-spacing:.02em}
.kpi svg.spark{position:absolute;right:0;bottom:0;left:0;width:100%;opacity:.55}

/* header counter badges */
.badges{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.bdg{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}

/* grid-style tables (Admin/Visitors use spans at 10px, not uppercase <th>) */
.tw.plain th{text-transform:none;letter-spacing:0;font-size:10px;font-weight:700;opacity:.4}

/* profit-per-month bars */
.pbars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;align-items:end;min-height:190px}
.pb{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:5px;text-align:center}
.pb .amt{font-size:10.5px;opacity:.6;font-variant-numeric:tabular-nums}
.pb .col{border-radius:4px 4px 0 0;background:var(--gold);opacity:.85}
.pb .col.under{background:var(--softred)}
.pb .m{font-size:10px;opacity:.45;margin-top:5px}
.pb .s{font-size:10px}
.expline{position:relative;height:0}
.expline i{position:absolute;left:0;right:0;border-top:1px dashed rgba(255,255,255,.35)}

/* status strips (OwnerControls) */
.strip{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);
  border-radius:12px;background:var(--inset);flex-wrap:wrap}
.strip .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.strip .t{font-size:12.5px;font-weight:700}
.strip .s{font-size:11px;opacity:.45;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.strip .sp{flex:1}
.warnbar{border:1px solid rgba(251,133,1,.3);background:rgba(251,133,1,.07);border-radius:10px;
  padding:10px 13px;font-size:12px;color:#FFD08A;line-height:1.55}
.infobar{border:1px solid rgba(33,158,188,.28);background:rgba(33,158,188,.06);border-radius:10px;
  padding:10px 13px;font-size:12px;opacity:.8;line-height:1.55}
.cap{font-size:11px;opacity:.35;line-height:1.6}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em;
  background:rgba(255,255,255,.06);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>

  <b>Demo build</b>
  <span>All customer, revenue and visitor records are synthetic · nothing here is connected to production</span>
</div>

<div id="shell">

  <div id="body">
    <nav id="rail"></nav>
    <div id="view"></div>
  </div>

</div>

/* ── tiny render helpers ─────────────────────────────────── */
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = n => (n<0?"-":"") + "$" + Math.abs(n).toLocaleString();
const pct = n => (n>0?"+":"") + (n*100).toFixed(0) + "%";

/* Card — PageCard.tsx: title 14/800/.12em uppercase, subtitle 12px green, mb 16, pad 24 */
function card(title, body, opts={}){
  opts = opts || {};
  let head = "";
  if(title != null || opts.sub != null || opts.right){
    const t = title != null ? `<div class="ct">${esc(title)}</div>` : "";
    const s = opts.sub != null ? `<div class="cs">${esc(opts.sub)}</div>` : "";
    head = opts.right
      ? `<div class="chead"><div class="crow"><div>${t}${s}</div><span class="sp"></span>${opts.right}</div></div>`
      : `<div class="chead">${t}${s}</div>`;
  }
  return `<div class="card${opts.tight?" tight":""}"${opts.style?` style="${opts.style}"`:""}>${head}${body}</div>`;
}

/* page header row — pages own their own header above the cards */
function phead(h1, sub, right){
  return `<div class="phead"><div><h1>${esc(h1)}</h1>${sub?`<div class="psub">${esc(sub)}</div>`:""}</div>
    <span class="sp"></span>${right||""}</div>`;
}

/* tab strip that actually switches — page key + list of labels */
function tabs(page, list, active){
  return `<div class="seg">${list.map(t=>
    `<button class="${t===active?"on":""}" data-tab="${esc(t)}" data-tabpage="${esc(page)}">${esc(t)}</button>`
  ).join("")}</div>`;
}

function tiles(list, cols){
  const c = cols || Math.min(list.length, 6);
  const items = list.map(t=>{
    const d = t.d ? `<div class="d ${t.up===true?"up":t.up===false?"dn":""}">${esc(t.d)}</div>` : "";
    const sp = t.s ? spark(t.s, t.up===false?"var(--softred)":"var(--cy)") : "";
    return `<div class="tile"><div class="l">${esc(t.l)}</div><div class="n">${esc(t.n)}</div>${d}${sp}</div>`;
  }).join("");
  return `<div class="tiles" style="grid-template-columns:repeat(${c},minmax(0,1fr))">${items}</div>`;
}

function spark(vals, color){
  const w=110,h=30, mn=Math.min(...vals), mx=Math.max(...vals), rg=(mx-mn)||1;
  const pts = vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-2-((v-mn)/rg)*(h-6)).toFixed(1)}`).join(" ");
  return `<svg class="sp" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" opacity=".8"/></svg>`;
}

function lineChart(series, opts={}){
  const w=opts.w||760, h=opts.h||190, pad=26;
  const all = series.flatMap(s=>s.v);
  const mn = opts.zero ? 0 : Math.min(...all), mx = Math.max(...all), rg=(mx-mn)||1;
  const n = series[0].v.length;
  const X = i => pad + (i/(n-1))*(w-pad*2);
  const Y = v => h-pad - ((v-mn)/rg)*(h-pad*2);
  const grid = [0,.25,.5,.75,1].map(f=>{
    const y = h-pad - f*(h-pad*2);
    return `<line x1="${pad}" x2="${w-pad}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,.06)"/>
      <text x="4" y="${(y+3).toFixed(1)}" font-size="9" fill="rgba(255,255,255,.3)">${Math.round(mn+f*rg).toLocaleString()}</text>`;
  }).join("");
  const paths = series.map(s=>{
    const d = s.v.map((v,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
    const area = `${d} L${X(n-1).toFixed(1)},${h-pad} L${X(0).toFixed(1)},${h-pad} Z`;
    return `${s.fill?`<path d="${area}" fill="${s.c}" opacity=".10"/>`:""}
      <path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"/>`;
  }).join("");
  const labs = (opts.x||[]).map((t,i)=>`<text x="${X(i).toFixed(1)}" y="${h-8}" font-size="9"
    fill="rgba(255,255,255,.3)" text-anchor="middle">${esc(t)}</text>`).join("");
  const leg = series.length>1 ? `<div class="chips" style="margin-top:8px">`+series.map(s=>
    `<span class="pill p-mt" style="color:${s.c};border-color:${s.c}55">${esc(s.n)}</span>`).join("")+`</div>` : "";
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">${grid}${paths}${labs}</svg>${leg}`;
}

function barChart(rows, opts={}){
  const w=opts.w||760, h=opts.h||200, pad=30, n=rows.length;
  const mx = Math.max(...rows.flatMap(r=>[r.a||0, r.b||0]))||1;
  const bw = (w-pad*2)/n;
  const bars = rows.map((r,i)=>{
    const x = pad + i*bw;
    const ha = ((r.a||0)/mx)*(h-pad*2), hb=((r.b||0)/mx)*(h-pad*2);
    return `<rect x="${(x+bw*0.16).toFixed(1)}" y="${(h-pad-ha).toFixed(1)}" width="${(bw*0.36).toFixed(1)}"
        height="${ha.toFixed(1)}" fill="${opts.ca||"var(--cy)"}" opacity=".85" rx="2"/>
      <rect x="${(x+bw*0.52).toFixed(1)}" y="${(h-pad-hb).toFixed(1)}" width="${(bw*0.30).toFixed(1)}"
        height="${hb.toFixed(1)}" fill="${opts.cb||"var(--orange)"}" opacity=".7" rx="2"/>
      <text x="${(x+bw/2).toFixed(1)}" y="${h-9}" font-size="9" fill="rgba(255,255,255,.32)" text-anchor="middle">${esc(r.m)}</text>`;
  }).join("");
  const base = `<line x1="${pad}" x2="${w-pad}" y1="${h-pad}" y2="${h-pad}" stroke="rgba(255,255,255,.1)"/>`;
  const leg = `<div class="chips" style="margin-top:8px">
    <span class="pill p-cy">${esc(opts.la||"A")}</span><span class="pill p-og">${esc(opts.lb||"B")}</span></div>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">${base}${bars}</svg>${leg}`;
}

function table(cols, rows, opts={}){
  const th = cols.map(c=>`<th class="${c.n?"num":""}">${esc(c.t||c)}</th>`).join("");
  const tb = rows.map(r=>`<tr>${r.map((cell,i)=>{
    const c = cols[i]||{};
    return `<td class="${c.n?"num":""} ${c.cls||""}">${cell}</td>`;
  }).join("")}</tr>`).join("");
  return `<div class="tw${opts.plain?" plain":""}"><table>${opts.nohead?"":`<thead><tr>${th}</tr></thead>`}<tbody>${tb}</tbody></table></div>`;
}

function pill(t, k){ return `<span class="pill p-${k||"mt"}">${esc(t)}</span>`; }
function bar(f, color){ return `<div class="bar"><i style="width:${Math.max(2,Math.min(100,f*100)).toFixed(0)}%;background:${color||"var(--cy)"}"></i></div>`; }
function seg(items, active){
  return `<div class="seg">${items.map(i=>`<button class="${i===active?"on":""}">${esc(i)}</button>`).join("")}</div>`;
}
function synth(txt){ return `<div class="synth">◆ ${esc(txt||"All customer records on this screen are synthetic demo data.")}</div>`; }

function gauge(label, value, frac, color){
  const r=34, cx=48, cy=48, C=Math.PI*r;
  const f = Math.max(-1, Math.min(1, frac));
  const len = Math.abs(f)*C*0.5;
  const dir = f>=0 ? 1 : 0;
  return `<div class="gauge">
    <svg viewBox="0 0 96 62" style="width:100%;height:auto">
      <path d="M14,48 A${r},${r} 0 0 1 82,48" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="7" stroke-linecap="round"/>
      <path d="M48,14 A${r},${r} 0 0 ${dir} ${(cx + (dir? 1:-1)*r*Math.sin(Math.abs(f)*Math.PI/2)).toFixed(1)},${(cy - r*Math.cos(Math.abs(f)*Math.PI/2)).toFixed(1)}"
        fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"/>
      <line x1="48" y1="48" x2="48" y2="20" stroke="rgba(255,255,255,.25)" stroke-width="1"/>
    </svg>
    <div class="gl">${esc(label)}</div><div class="gv" style="color:${color}">${esc(value)}</div></div>`;
}

function ladder(rows, spot){
  const mx = Math.max(...rows.flatMap(r=>[Math.abs(r[1]),Math.abs(r[2])]))||1;
  return `<div class="ladder">${rows.map(r=>{
    const [k,prior,now] = r;
    const hi = Math.abs(now)===Math.max(...rows.map(x=>Math.abs(x[2])));
    const neg = now<0;
    const wPrior = Math.abs(prior)/mx*100, wNow = Math.abs(now)/mx*100;
    const delta = now-prior;
    const tag = Math.abs(delta) < 12 ? "" : (now>0
      ? (delta>0 ? "built"   : "eroded")     // positive gamma: added / taken off
      : (delta<0 ? "deepened" : "lifted"));  // negative gamma: more / less negative
    return `<div class="rung ${hi?"hi":""}">
      <div class="k">${k}</div>
      <div class="lft">${neg?`<i style="width:${wNow.toFixed(0)}%"></i><i style="width:${wPrior.toFixed(0)}%;background:transparent;border:1px solid rgba(244,148,142,.5)"></i>`:""}</div>
      <div class="rgt">${!neg?`<i style="width:${wNow.toFixed(0)}%"></i><i style="width:${wPrior.toFixed(0)}%;background:transparent;border:1px solid rgba(142,202,230,.5)"></i>`:""}</div>
      <div class="tagx">${tag?esc(tag):""}${k===spot?" ← spot":""}</div>
    </div>`;
  }).join("")}</div>`;
}

function worldMap(dots){
  const land = [
    "M60,58 L96,44 L150,40 L182,54 L196,80 L176,104 L150,112 L128,150 L112,168 L96,150 L84,116 L64,92 Z",
    "M150,178 L176,166 L196,182 L200,222 L182,262 L162,272 L150,240 L142,206 Z",
    "M300,52 L360,40 L400,48 L412,66 L396,84 L360,92 L326,86 L302,70 Z",
    "M318,96 L360,92 L392,104 L404,140 L388,182 L360,214 L336,206 L322,168 L312,130 Z",
    "M414,44 L520,32 L600,46 L648,70 L640,104 L596,126 L540,120 L488,100 L440,80 Z",
    "M600,130 L648,120 L676,140 L668,168 L634,176 L606,158 Z",
    "M652,196 L690,186 L714,206 L708,242 L678,254 L656,232 Z"
  ];
  const paths = land.map(d=>`<path d="${d}" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,.07)"/>`).join("");
  const pts = dots.map(([x,y,k])=>{
    if(k===2) return `<circle cx="${x*7.6}" cy="${y*3.1}" r="3.2" fill="var(--gold)" opacity=".95"/>`;
    if(k===1) return `<circle cx="${x*7.6}" cy="${y*3.1}" r="3" fill="none" stroke="var(--gold)" stroke-width="1.3" opacity=".8"/>`;
    return `<circle cx="${x*7.6}" cy="${y*3.1}" r="2.2" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1"/>`;
  }).join("");
  return `<div class="mapwrap"><svg viewBox="0 0 760 310" style="width:100%;height:auto;display:block">${paths}${pts}</svg></div>`;
}

function heat(rows){ /* rows: [[label, [v...]]] */
  const mx = Math.max(...rows.flatMap(r=>r[1]))||1;
  return `<div style="display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:11px">
    ${rows.map(r=>`<div class="mut">${esc(r[0])}</div>
      <div style="display:grid;grid-template-columns:repeat(${r[1].length},1fr);gap:2px">
        ${r[1].map(v=>`<div style="height:14px;border-radius:2px;background:rgba(33,158,188,${(0.08+0.85*v/mx).toFixed(2)})"></div>`).join("")}
      </div>`).join("")}
  </div>`;
}

/* LiveKpiCard — label 12px gold uppercase .07em, value 30px mono, delta pill */
function kpi(label, value, sub, opts){
  opts = opts || {};
  const d = opts.delta;
  const dp = d == null ? "" :
    `<div class="kd" style="color:${d.dir==="up"?"var(--ok)":d.dir==="down"?"var(--softred)":"rgba(255,255,255,.4)"}">
       ${d.dir==="up"?"↑":d.dir==="down"?"↓":"→"} ${esc(d.text)}</div>`;
  const sp = opts.points ? sparkWide(opts.points, opts.accent || "var(--cy)") : "";
  return `<div class="kpi">${dp}
    <div class="kl">${esc(label)}</div>
    <div class="kv"${opts.accent?` style="color:${opts.accent}"`:""}>${esc(value)}</div>
    <div class="ks">${esc(sub)}</div>${sp}</div>`;
}
function sparkWide(vals, color){
  const w=300,h=36, mn=Math.min(...vals), mx=Math.max(...vals), rg=(mx-mn)||1;
  const pts = vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-((v-mn)/rg)*(h-6)-2).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" height="36">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" opacity=".75"/></svg>`;
}
const bdg = (t,c) => `<span class="bdg" style="color:${c}">${esc(t)}</span>`;

/* fmtMoney from Sales.tsx: $1.2K at >= 1000, else $29 — no cents, no separators */
const fm = n => (n<0?"−":"") + (Math.abs(n)>=1000 ? "$"+(Math.abs(n)/1000).toFixed(1)+"K" : "$"+Math.abs(n).toFixed(0));

/* ── state ───────────────────────────────────────────────── */
let ACTIVE = "Hub";
let TAB = {};                    // per-page active tab
const FAV_KEY = "cbedge.demoRail.favorites.v1";
let FAVS = (()=>{ try{ return JSON.parse(localStorage.getItem(FAV_KEY)) || []; }catch(e){ return []; } })();
function saveFavs(){ try{ localStorage.setItem(FAV_KEY, JSON.stringify(FAVS)); }catch(e){} }

/* ── rail (OwnerShell.tsx) ───────────────────────────────── */
function railLink(l, accent, opts){
  opts = opts || {};
  const here = l.key === ACTIVE;
  const starrable = opts.star !== false;
  const fav = !!opts.fav;
  const style = here
    ? `color:${accent};background:${accent}1f;border-color:${accent}59;font-weight:800`
    : "";
  return `<div class="rrow">
    <span class="rlink ${starrable?"":"nostar"}" data-go="${l.key}" style="${style}">
      <span class="gl" aria-hidden>${l.glyph}</span>${esc(l.label)}</span>
    ${starrable?`<button class="rstar ${fav?"on":""}" data-fav="${l.key}"
        title="${fav?"Remove from favorites":"Pin to favorites"}">${fav?"★":"☆"}</button>`:""}
  </div>`;
}

function renderRail(){
  const favSet = new Set(FAVS);
  const favLinks = FAVS.map(k=>ALL.find(l=>l.key===k)).filter(Boolean);
  const pinned = `<div class="rblock">${NAV.pinned.map(l=>railLink(l,"#219EBC",{star:false})).join("")}</div>`;
  const favBlock = favLinks.length
    ? `<div class="rblock"><div class="rhead" style="color:#FFB703">★ Favorites</div>
        ${favLinks.map(l=>railLink(l, ACCENT_OF[l.key]||"#219EBC", {fav:true})).join("")}
        <div class="rdiv"></div></div>`
    : "";
  const groups = NAV.groups.map(g=>{
    const links = g.links.filter(l=>!favSet.has(l.key));
    if(!links.length) return "";
    return `<div class="rblock"><div class="rhead" style="color:${g.accent}">${esc(g.label)}</div>
      ${links.map(l=>railLink(l,g.accent)).join("")}</div>`;
  }).join("");
  return pinned + favBlock + groups;
}

/* ── router ──────────────────────────────────────────────── */
function go(key){
  if(!P[key]) key = "Hub";
  ACTIVE = key;
  document.getElementById("rail").innerHTML = renderRail();
  const v = document.getElementById("view");
  v.innerHTML = `<div class="page">${P[key]()}</div>`;
  v.scrollTop = 0;
  document.body.classList.remove("railopen");
  try{ location.hash = "#" + key; }catch(e){}
  wire();
}

/* tab switch inside a page — re-renders just the page */
function setTab(page, tab){
  TAB[page] = tab;
  const v = document.getElementById("view");
  v.innerHTML = `<div class="page">${P[ACTIVE]()}</div>`;
  wire();
}
function tabOf(page, dflt){ return TAB[page] || dflt; }

function wire(){
  document.querySelectorAll("[data-go]").forEach(el=>{
    el.onclick = () => go(el.getAttribute("data-go"));
  });
  document.querySelectorAll("[data-fav]").forEach(el=>{
    el.onclick = e => {
      e.stopPropagation();
      const k = el.getAttribute("data-fav");
      FAVS = FAVS.includes(k) ? FAVS.filter(x=>x!==k) : [...FAVS, k];
      saveFavs();
      document.getElementById("rail").innerHTML = renderRail();
      wire();
    };
  });
  document.querySelectorAll("[data-tab]").forEach(el=>{
    el.onclick = () => setTab(el.getAttribute("data-tabpage") || ACTIVE, el.getAttribute("data-tab"));
  });
}

function clock(){
  const el = document.getElementById("tclock");
  if(!el) return;
  el.textContent = new Date().toLocaleTimeString("en-US",
    { timeZone:"America/New_York", hour12:false, hour:"2-digit", minute:"2-digit", second:"2-digit" }) + " ET";
}

window.addEventListener("hashchange", () => {
  const k = location.hash.replace("#","");
  if(k && k !== ACTIVE) go(k);
});

(function init(){
  const m = document.getElementById("tmenu");
  if(m) m.onclick = () => document.body.classList.toggle("railopen");
  clock(); setInterval(clock, 1000);
  const k = location.hash.replace("#","");
  go(k && P[k] ? k : "Hub");
})();

</script>
