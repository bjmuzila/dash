server {
    listen 8085;
    server_name affiliate.cbedge.net;
    root /usr/share/nginx/html;
    index index.html;

    # Nothing here uploads anything. The application form is a few KB of JSON;
    # a low cap is one less thing to abuse on a PUBLIC, signed-out endpoint.
    client_max_body_size 1m;

    # Resolve the backend through Docker's embedded DNS at request time, so
    # nginx boots even when the dashboard container is momentarily down instead
    # of crash-looping on "host not found in upstream". Port must match PORT in
    # .env.local (this deploy = 3002).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $up dashboard:3002;

    # ── The shareable referral link ──────────────────────────────────────────
    # /r/FLOWDESK is what an affiliate actually posts. It maps onto the click
    # endpoint, which logs the click, sets the attribution cookie and 302s to
    # cbedge.net. Kept as a rewrite here rather than a route in the SPA because
    # the whole point is that it never loads JavaScript: a redirect that waits
    # on a React bundle is a redirect a lot of people bounce out of.
    location ~ ^/r/([A-Za-z0-9]{1,16})/?$ {
        proxy_pass http://$up/api/aff/go?code=$1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # SPA client-side routing: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Everything this app needs from the backend. DELIBERATELY NARROW — only
    # /api. affiliate.cbedge.net has no reason to reach /proxy (market data) or
    # /ws (the GEX feed), and not proxying them means a bug in this public,
    # signed-out app can never touch the trading stack.
    location /api {
        proxy_pass http://$up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Auth endpoints must never be cached anywhere in front of the app. The
    # backend already sends no-store; this is belt-and-braces against a
    # Cloudflare rule ever deciding /api/aff/auth/me looks cacheable.
    location /api/aff/auth {
        proxy_pass http://$up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Hashed build assets — cache hard (Vite fingerprints filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The landing page IS meant to be found — this is the one CB Edge subdomain
    # that wants indexing. The dashboard behind it is cookie-gated, so nothing
    # private is reachable by a crawler anyway.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nAllow: /$\nDisallow: /dashboard\nDisallow: /r/\n";
    }
}
