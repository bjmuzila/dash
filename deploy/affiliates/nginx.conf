# affiliates.cbedge.net (and the old affiliate.cbedge.net) → voltick.io/Bzila
#
# The CB Edge affiliate program was retired 2026-09-26; its traffic now goes to
# Bzila's Voltick join link. Every path and every host that reaches this
# container gets the same redirect — old /r/<CODE> links included. The query
# string is dropped on purpose (no CB Edge referral codes leak into Voltick).
#
# 302, not 301: browsers cache a 301 forever, so a later change of target
# would never reach anyone who already clicked. Switch to 301 only once the
# target is final.
#
# Mounted read-only by the `affiliates-redirect` service in docker-compose.yml.
# Changes here need `docker compose restart affiliates-redirect`.
server {
    listen 8085 default_server;
    server_name _;

    access_log off;
    server_tokens off;

    location / {
        return 302 https://voltick.io/Bzila;
    }
}
