<!doctype html>
<!--
  journal.cbedge.net's door (deploy/journal/nginx.conf → @denied). Shown for
  401 (not signed in), 403 (signed in, not the owner) and 503 (gate trouble).
  Self-contained: no request leaves this page except the sign-in link.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Voltick Journal · private</title>
<style>
  :root { --bg:#0b0d10; --card:#13161b; --fg:#e8eaed; --muted:#9aa0a6; --line:#262a31; --accent:#e8eaed; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f7f9; --card:#fff; --fg:#14171c; --muted:#5f6670; --line:#e2e5ea; --accent:#14171c; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 20px; }
  a.cta { display:block; text-align:center; padding:10px 14px; border-radius:8px; background:var(--accent); color:var(--bg);
          text-decoration:none; font-weight:600; }
  a.quiet { display:inline-block; margin-top:14px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
  <main class="card">
    <h1>Voltick Journal</h1>
    <p>You're signed in, but this journal is private to its owner — it isn't part of a CB Edge or Voltick membership.</p>
    <a class="cta" href="https://vela.cbedge.net/">Back to Vela &rarr;</a>
    <a class="quiet" href="https://cbedge.net/">Go to cbedge.net</a>
  </main>
</body>
</html>
