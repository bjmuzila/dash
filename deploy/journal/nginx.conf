# journal.cbedge.net — the gate in front of the Trade Journal container.
#
# Mounted into a stock nginx:alpine (`journal-gate` in docker-compose.yml), the
# same way demo-sites mounts its config: nothing to build. Model: deploy/vela/
# nginx.conf — read its comments for the reasoning behind each block.
#
# OWNER ONLY. The journal is single-user: one SQLite file, one set of broker
# keys, no accounts. Everyone let through here reads and writes the SAME
# journal, so the gate is /api/tradejournal/verify (owner), NOT /api/vela/verify
# (members). Do not point this at a wider gate.
#
# Reached only through the Cloudflare Tunnel (journal.cbedge.net → 127.0.0.1:8092).
server {
    listen 8092;
    server_name journal.cbedge.net;

    client_max_body_size 25m;   # statement imports and journal attachments

    # Lazy resolution: nginx starts even while either backend is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gate    dashboard:3002;
    set $journal journal:3000;

    # ── THE GATE ───────────────────────────────────────────────────────────────
    # 200 serve · 401 no session · 403 not the owner · 503 our DB, not you.
    # The CB Edge session cookie is domain-wide, so a cbedge.net sign-in is read here.
    location = /_journalauth {
        internal;
        proxy_pass http://$gate/api/tradejournal/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    error_page 401 403 503 = @denied;
    location @denied {
        root /usr/share/nginx/html;
        try_files /denied.html =500;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Everything — pages, the journal's own /api, /_next assets — is gated.
    location / {
        auth_request /_journalauth;
        proxy_pass http://$journal;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # AI recaps and broker syncs can run long.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
