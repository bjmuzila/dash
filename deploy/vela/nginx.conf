# vela.cbedge.net — the standalone Vela chart workspace.
#
# Serves the `npm run build:vela` output of cbedge-v3 (deploy/vela/Dockerfile)
# and reverse-proxies /api /proxy /ws to the dashboard container, exactly like
# voltick-vite/nginx.conf does for voltick.cbedge.net. That file is the model
# for this one; read its comments for the reasoning behind each block.
#
# Reached only through the Cloudflare Tunnel (vela.cbedge.net → 127.0.0.1:8091).
server {
    listen 8091;
    server_name vela.cbedge.net;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # Resolve the backend at request time (lazy), so nginx starts even while the
    # dashboard container is down and never crash-loops on "host not found".
    # Port must match PORT in .env.local (this deploy = 3002).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $up dashboard:3002;

    # ── THE GATE ───────────────────────────────────────────────────────────────
    #
    # Every path that serves the app carries `auth_request /_velaauth`, so nginx
    # asks the backend who you are BEFORE it hands over a byte of the bundle.
    # A gate inside React would already have shipped the whole chart app.
    #
    # Backend route: /api/vela/verify (server-v2/api-router.js)
    #   200 serve · 401 no session · 403 no grant · 503 DB trouble
    # Phase 1: owner + the voltick.cbedge.net grant list (voltick_access).
    location = /_velaauth {
        internal;
        # The subrequest inherits the client's Cookie header. The CB Edge
        # session cookie is domain-wide, so a cbedge.net sign-in is read here.
        proxy_pass http://$up/api/vela/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    error_page 401 403 = @denied;
    error_page 503 = @denied;
    location @denied {
        root /usr/share/nginx/html;
        try_files /denied.html =500;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # The only page served without a check. A standalone file, not an SPA route.
    location = /denied.html {
        auth_request off;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # index.html is the only unhashed file and it names the hashed bundle — never
    # cache it, or a device keeps loading the old app after a deploy.
    location = /index.html {
        auth_request /_velaauth;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # SPA routing: / (desktop), /m (phone), anything else → NotFound in the app.
    location / {
        auth_request /_velaauth;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    # Data from the CB Edge backend. NOT behind auth_request: these are the
    # backend's own routes and it enforces its own auth on every one of them
    # (and the gate itself, /api/vela/verify, lives here). Reaching /api/*
    # through this host reaches exactly what cbedge.net/api/* already does.
    location ~ ^/(api|proxy)(/|$) {
        proxy_pass http://$up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Live socket (/ws/gex) — Vela's ES / NQ tail reads the futures frames.
    location /ws {
        proxy_pass http://$up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed build assets — cached hard (Vite fingerprints the names). Gated too:
    # the bundle IS the content.
    location /assets/ {
        auth_request /_velaauth;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
