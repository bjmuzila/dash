# vela.cbedge.net — the standalone Vela chart workspace.
#
# Serves the `npm run build:vela` output of cbedge-v3 (deploy/vela/Dockerfile)
# and reverse-proxies /api /proxy /ws to the dashboard container, exactly like
# voltick-vite/nginx.conf does for voltick.cbedge.net. That file is the model
# for this one; read its comments for the reasoning behind each block.
#
# Reached only through the Cloudflare Tunnel (vela.cbedge.net → 127.0.0.1:8091).
# ── Auth-decision cache (2026-10-09 audit) ──────────────────────────────────
# Every page, chunk and asset below asks /api/vela/verify first. Without a cache
# that is one dashboard round trip per file, and while the dashboard restarts
# (every deploy) every one of them failed into nginx's stock 500 page.
#
# The cache is keyed on the CB Edge session cookie alone, so one person's answer
# can never be served to another. A grant decision is reused for 60s (a revoke
# takes up to a minute to bite here; the data routes still check every request
# themselves), a denial for 10s. When the backend errors or times out, the last
# good decision for that session is served instead (up to `inactive`), so a
# signed-in user keeps loading the app through a restart.
proxy_cache_path /var/cache/nginx/velaauth levels=1:2 keys_zone=velaauth:10m
                 max_size=50m inactive=12h use_temp_path=off;

# No session cookie at all → never cache (the answer is always 401 anyway).
map $cookie_cbe_session $vela_no_session {
    ""      1;
    default 0;
}

server {
    listen 8091;
    server_name vela.cbedge.net;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # Compress JS/CSS and the proxied JSON on the way out (off by default in
    # nginx:alpine). text/event-stream is deliberately NOT listed: compressing
    # SSE buffers it.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml;

    # Resolve the backend at request time (lazy), so nginx starts even while the
    # dashboard container is down and never crash-loops on "host not found".
    # Port must match PORT in .env.local (this deploy = 3002).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $up dashboard:3002;

    # ── THE GATE ───────────────────────────────────────────────────────────────
    #
    # Every path that serves the app carries `auth_request /_velaauth`, so nginx
    # asks the backend who you are BEFORE it hands over a byte of the bundle.
    # A gate inside React would already have shipped the whole chart app.
    #
    # Backend route: /api/vela/verify (server-v2/api-router.js)
    #   200 serve · 401 no session · 403 no grant · 503 DB trouble
    # Phase 1: owner + the voltick.cbedge.net grant list (voltick_access).
    location = /_velaauth {
        internal;
        # The subrequest inherits the client's Cookie header. The CB Edge
        # session cookie is domain-wide, so a cbedge.net sign-in is read here.
        proxy_pass http://$up/api/vela/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Fail fast: a stalled dashboard used to hold every page and asset for
        # nginx's default 60s before the 500.
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;

        proxy_cache velaauth;
        proxy_cache_key $cookie_cbe_session;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_cache_valid 200 60s;
        proxy_cache_valid 401 403 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_bypass $vela_no_session;
        proxy_no_cache $vela_no_session;

        # LOAD-BEARING: the server-level `error_page 500 502 503 504 = @down`
        # below would otherwise apply INSIDE this subrequest too. @down answers
        # 200 (the holding page), and auth_request reads a 200 as "allowed", so
        # a dashboard outage would hand the app to anyone. Inside the gate, an
        # error must stay an error.
        error_page 500 502 503 504 = @authfail;
    }
    location @authfail {
        internal;
        return 503;
    }

    error_page 401 403 = @denied;
    # auth_request turns ANY other subrequest status (502 while the dashboard
    # restarts, 503 from verify's DB check, a timeout) into 500. Before
    # 2026-10-09 nothing mapped 500, so users saw nginx's stock error page.
    # Now: the holding page for a page load, a short JSON 503 for anything else.
    error_page 500 502 503 504 = @down;
    location @down {
        add_header Cache-Control "no-store" always;
        add_header Retry-After "3" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        if ($http_accept ~* "text/html") {
            rewrite ^ /holding.html last;
        }
        default_type application/json;
        return 503 '{"ok":false,"error":"restarting","retryAfter":3}';
    }
    location = /holding.html {
        internal;
        auth_request off;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "3" always;
    }
    location @denied {
        root /usr/share/nginx/html;
        try_files /denied.html =500;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # The only page served without a check. A standalone file, not an SPA route.
    location = /denied.html {
        auth_request off;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # index.html is the only unhashed file and it names the hashed bundle — never
    # cache it, or a device keeps loading the old app after a deploy.
    location = /index.html {
        auth_request /_velaauth;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # SPA routing: / (desktop), /m (phone), anything else → NotFound in the app.
    location / {
        auth_request /_velaauth;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    # Company logos (cbedge-v3 ChipLogo → /logos/<SYM>.png?v=N). They live in
    # the Next app's public/, not in this build, so until 2026-10-09 try_files
    # below answered them with index.html (text/html) after an auth check, and
    # every logo on Vela was broken. Public images, the same ones cbedge.net
    # serves to anyone: no gate, cached at the browser.
    location ^~ /logos/ {
        proxy_pass http://$up;
        proxy_set_header Host cbedge.net;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @logo_missing;
    }
    location @logo_missing {
        return 404;
    }

    # Data from the CB Edge backend. NOT behind auth_request: these are the
    # backend's own routes and it enforces its own auth on every one of them
    # (and the gate itself, /api/vela/verify, lives here). Reaching /api/*
    # through this host reaches exactly what cbedge.net/api/* already does.
    location ~ ^/(api|proxy)(/|$) {
        proxy_pass http://$up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Live socket (/ws/gex) — Vela's ES / NQ tail reads the futures frames.
    location /ws {
        proxy_pass http://$up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed build assets — cached hard (Vite fingerprints the names). Gated too:
    # the bundle IS the content.
    location /assets/ {
        auth_request /_velaauth;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
