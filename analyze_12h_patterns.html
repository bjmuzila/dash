<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12-Hour Candle Pattern Analysis</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #f1f5f9;
        }

        .upload-section {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .file-input {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="file"] {
            flex: 1;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            color: #e2e8f0;
            cursor: pointer;
        }

        button {
            padding: 10px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background: #2563eb;
        }

        button:disabled {
            background: #64748b;
            cursor: not-allowed;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stats-card {
            background: #1e293b;
            border-left: 4px solid #3b82f6;
            border-radius: 8px;
            padding: 20px;
        }

        .stats-card h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #60a5fa;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #334155;
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #94a3b8;
        }

        .stat-value {
            font-weight: 600;
            font-size: 16px;
        }

        .outcome-broke-high { color: #4ade80; }
        .outcome-broke-low { color: #f87171; }
        .outcome-broke-both { color: #fbbf24; }
        .outcome-broke-none { color: #94a3b8; }
        /* After 1 candle */
        .outcome-broke-high--after-1-candle- { color: #4ade80; }
        .outcome-broke-low--after-1-candle- { color: #f87171; }
        .outcome-broke-both--after-1-candle- { color: #fbbf24; }
        .outcome-broke-none--after-1-candle- { color: #cbd5e1; }
        /* After 2 candles */
        .outcome-broke-high--after-2-candles- { color: #22c55e; }
        .outcome-broke-low--after-2-candles- { color: #ef4444; }
        .outcome-broke-both--after-2-candles- { color: #eab308; }
        .outcome-broke-none--after-2-candles- { color: #64748b; }
        /* After 3 candles */
        .outcome-broke-high--after-3-candles- { color: #16a34a; }
        .outcome-broke-low--after-3-candles- { color: #dc2626; }
        .outcome-broke-both--after-3-candles- { color: #ca8a04; }
        .outcome-broke-none--after-3-candles- { color: #475569; }

        .crosstab-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .crosstab {
            background: #1e293b;
            border-radius: 8px;
            padding: 20px;
            overflow-x: auto;
        }

        .crosstab h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #60a5fa;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            padding: 10px 8px;
            text-align: left;
            border: 1px solid #334155;
        }

        th {
            background: #0f172a;
            font-weight: 600;
            color: #60a5fa;
        }

        tr:hover {
            background: #334155;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #94a3b8;
        }

        .spinner {
            border: 3px solid #334155;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #7f1d1d;
            border: 1px solid #dc2626;
            color: #fca5a5;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .details-table {
            background: #1e293b;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            max-height: 600px;
            overflow-y: auto;
        }

        .details-table h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #60a5fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ES 12-Hour Candle Pattern Analysis</h1>

        <div class="upload-section">
            <div class="file-input">
                <input type="file" id="csvFile" accept=".csv" placeholder="Select CSV file...">
                <button onclick="loadFile()">Load CSV</button>
            </div>
            <div class="error" id="error"></div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing candles...</p>
            </div>
        </div>

        <div id="results" style="display: none;">
            <div style="text-align: right; margin-bottom: 15px; display: flex; gap: 10px; justify-content: flex-end;">
                <button onclick="downloadCSV()" style="background: #10b981;">Download CSV</button>
                <button onclick="downloadStatsPNG()" style="background: #f59e0b;">Download Stats PNG</button>
                <button onclick="downloadCrosstabPNG()" style="background: #8b5cf6;">Download Crosstab PNG</button>
            </div>
            <div class="stats-grid">
                <div class="stats-card">
                    <h2>6AM Start (6am-6pm, 6pm-6am)</h2>
                    <div id="stats-6am"></div>
                </div>
                <div class="stats-card">
                    <h2>6PM Start (6pm-6am, 6am-6pm)</h2>
                    <div id="stats-6pm"></div>
                </div>
            </div>

            <div class="crosstab-section">
                <div class="crosstab">
                    <h3>Pattern × Outcome (6AM Start)</h3>
                    <div id="crosstab-6am"></div>
                </div>
                <div class="crosstab">
                    <h3>Pattern × Outcome (6PM Start)</h3>
                    <div id="crosstab-6pm"></div>
                </div>
            </div>

            <div class="details-table">
                <h3>Detailed Results (6AM Start)</h3>
                <div id="details-6am"></div>
            </div>

            <div class="details-table">
                <h3>Detailed Results (6PM Start)</h3>
                <div id="details-6pm"></div>
            </div>
        </div>
    </div>

    <script>
        let currentResults6am = [];
        let currentResults6pm = [];

        function downloadCSV() {
            let csv = 'Start Time,Pattern,C1,C2,C3,Pattern High,Pattern Low,Next High,Next Low,Outcome,Follow-Up Candles\n';

            // 6AM Start
            csv += '\n6AM START\n';
            currentResults6am.forEach(r => {
                const followUp = r.followUpOutcomes ? r.followUpOutcomes.join(' → ') : '';
                csv += `"6AM","${r.pattern}","${r.c1}","${r.c2}","${r.c3}","${r.pHigh}","${r.pLow}","${r.nHigh}","${r.nLow}","${r.outcome}","${followUp}"\n`;
            });

            // 6PM Start
            csv += '\n6PM START\n';
            currentResults6pm.forEach(r => {
                const followUp = r.followUpOutcomes ? r.followUpOutcomes.join(' → ') : '';
                csv += `"6PM","${r.pattern}","${r.c1}","${r.c2}","${r.c3}","${r.pHigh}","${r.pLow}","${r.nHigh}","${r.nLow}","${r.outcome}","${followUp}"\n`;
            });

            // Add summary stats
            csv += '\n\n=== 6AM START - SUMMARY ===\nOutcome,Count,Percentage\n';
            csv = addStatsToCSV(csv, currentResults6am);

            csv += '\n\n=== 6PM START - SUMMARY ===\nOutcome,Count,Percentage\n';
            csv = addStatsToCSV(csv, currentResults6pm);

            // Download
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `12h-candle-patterns-${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function addStatsToCSV(csv, results) {
            const outcomes = {};
            results.forEach(r => {
                outcomes[r.outcome] = (outcomes[r.outcome] || 0) + 1;
            });

            const outcomeOrder = [
                'Broke High', 'Broke Low', 'Broke Both', 'Broke None',
                'Still None (1 candle)', 'Still None (2 candles)', 'Still None (3 candles)'
            ];

            outcomeOrder.forEach(o => {
                const count = outcomes[o] || 0;
                if (count > 0) {
                    const pct = (100 * count / results.length).toFixed(1);
                    csv += `"${o}",${count},${pct}%\n`;
                }
            });

            csv += `"Total Patterns",${results.length},100%\n`;
            return csv;
        }

        async function downloadStatsPNG() {
            const container = document.querySelector('.stats-grid');
            if (!container) {
                showError('Stats section not found');
                return;
            }

            try {
                const canvas = await html2canvas(container, {
                    backgroundColor: '#0f172a',
                    scale: 2,
                    logging: false
                });

                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = `12h-candle-stats-${new Date().toISOString().split('T')[0]}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (err) {
                showError('Failed to download stats: ' + err.message);
            }
        }

        async function downloadCrosstabPNG() {
            const container = document.querySelector('.crosstab-section');
            if (!container) {
                showError('Crosstab section not found');
                return;
            }

            try {
                const canvas = await html2canvas(container, {
                    backgroundColor: '#0f172a',
                    scale: 2,
                    logging: false
                });

                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = `12h-candle-crosstab-${new Date().toISOString().split('T')[0]}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (err) {
                showError('Failed to download crosstab: ' + err.message);
            }
        }

        function showError(msg) {
            const err = document.getElementById('error');
            err.textContent = msg;
            err.style.display = 'block';
        }

        function clearError() {
            document.getElementById('error').style.display = 'none';
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function loadFile() {
            clearError();
            const file = document.getElementById('csvFile').files[0];
            if (!file) {
                showError('Please select a file');
                return;
            }

            showLoading(true);
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const csv = e.target.result;
                    const data = Papa.parse(csv, { header: false, skipEmptyLines: true });
                    processData(data.data);
                    showLoading(false);
                } catch (err) {
                    showError('Error parsing CSV: ' + err.message);
                    showLoading(false);
                }
            };
            reader.readAsText(file);
        }

        function parseTimestamp(ts) {
            const year = parseInt(ts.substr(0, 4));
            const month = parseInt(ts.substr(4, 2)) - 1;
            const day = parseInt(ts.substr(6, 2));
            const hour = parseInt(ts.substr(9, 2));
            const min = parseInt(ts.substr(11, 2));
            const sec = parseInt(ts.substr(13, 2));
            return new Date(year, month, day, hour, min, sec);
        }

        function create12hCandles(rows, startHour) {
            const candles = [];
            let current = null;

            for (const row of rows) {
                if (row.length < 5) continue;

                const dt = parseTimestamp(row[0]);
                const open = parseFloat(row[1]);
                const high = parseFloat(row[2]);
                const low = parseFloat(row[3]);
                const close = parseFloat(row[4]);

                let hour = dt.getHours();
                let date = new Date(dt);

                // Determine bucket
                let bucketHour, bucketDate;
                if (startHour === 6) {
                    if (hour >= 6 && hour < 18) {
                        bucketHour = 6;
                        bucketDate = new Date(dt);
                    } else {
                        bucketHour = 18;
                        if (hour < 6) {
                            bucketDate = new Date(dt);
                            bucketDate.setDate(bucketDate.getDate() - 1);
                        } else {
                            bucketDate = new Date(dt);
                        }
                    }
                } else {
                    if (hour >= 18 || hour < 6) {
                        bucketHour = 18;
                        if (hour < 6) {
                            bucketDate = new Date(dt);
                            bucketDate.setDate(bucketDate.getDate() - 1);
                        } else {
                            bucketDate = new Date(dt);
                        }
                    } else {
                        bucketHour = 6;
                        bucketDate = new Date(dt);
                    }
                }

                const key = bucketDate.toISOString().split('T')[0] + '_' + bucketHour;

                if (!current || current.key !== key) {
                    if (current) candles.push(current);
                    current = {
                        key, date: bucketDate, hour: bucketHour,
                        open, high, low, close
                    };
                } else {
                    current.high = Math.max(current.high, high);
                    current.low = Math.min(current.low, low);
                    current.close = close;
                }
            }

            if (current) candles.push(current);
            return candles;
        }

        function classifySize(bodies) {
            const min = Math.min(...bodies);
            const max = Math.max(...bodies);
            const range = max - min > 0 ? max - min : 1;

            return bodies.map(b => {
                if (b <= min + range * 0.33) return 1;
                if (b <= min + range * 0.67) return 2;
                return 3;
            });
        }

        function analyzePatterns(candles) {
            const results = [];

            for (let i = 0; i < candles.length - 3; i++) {
                const c1 = candles[i], c2 = candles[i+1], c3 = candles[i+2], c4 = candles[i+3];

                const bodies = [
                    Math.abs(c1.close - c1.open),
                    Math.abs(c2.close - c2.open),
                    Math.abs(c3.close - c3.open)
                ];

                const sizes = classifySize(bodies);
                const pattern = sizes.join('-');
                const direction = c3.close > c1.close ? 'Bullish' : 'Bearish';
                const name = `${pattern} ${direction} Reversal`;

                const pHigh = Math.max(c1.high, c2.high, c3.high);
                const pLow = Math.min(c1.low, c2.low, c3.low);

                // Trigger candle is C3 (last candle of pattern)
                const triggerBrokeHigh = c3.high > pHigh;
                const triggerBrokeLow = c3.low < pLow;

                let triggerOutcome;
                if (triggerBrokeHigh && triggerBrokeLow) triggerOutcome = 'Broke Both';
                else if (triggerBrokeHigh) triggerOutcome = 'Broke High';
                else if (triggerBrokeLow) triggerOutcome = 'Broke Low';
                else triggerOutcome = 'Broke None';

                // Track follow-ups (C4, C5, C6) - only if trigger didn't break
                let followUpOutcomes = [];
                let finalOutcome = triggerOutcome;

                if (triggerOutcome === 'Broke None') {
                    // Check next 3 candles after trigger
                    for (let j = 1; j <= 3; j++) {
                        if (i + 3 + j >= candles.length) break;

                        const cn = candles[i + 3 + j];
                        const brokeHn = cn.high > pHigh;
                        const brokeLn = cn.low < pLow;

                        let cnOutcome;
                        if (brokeHn && brokeLn) {
                            cnOutcome = `Broke Both (after ${j} candle${j > 1 ? 's' : ''})`;
                        } else if (brokeHn) {
                            cnOutcome = `Broke High (after ${j} candle${j > 1 ? 's' : ''})`;
                        } else if (brokeLn) {
                            cnOutcome = `Broke Low (after ${j} candle${j > 1 ? 's' : ''})`;
                        }

                        if (cnOutcome) {
                            followUpOutcomes.push(cnOutcome);
                            finalOutcome = cnOutcome;
                            break; // Stop once it breaks
                        }
                    }
                }

                results.push({
                    pattern: name,
                    c1: `${c1.open.toFixed(2)}/${c1.close.toFixed(2)}`,
                    c2: `${c2.open.toFixed(2)}/${c2.close.toFixed(2)}`,
                    c3: `${c3.open.toFixed(2)}/${c3.close.toFixed(2)}`,
                    pHigh: pHigh.toFixed(2),
                    pLow: pLow.toFixed(2),
                    nHigh: c4.high.toFixed(2),
                    nLow: c4.low.toFixed(2),
                    outcome: finalOutcome,
                    followUpOutcomes
                });
            }

            return results;
        }

        function buildStatsTable(results) {
            const outcomes = {};
            results.forEach(r => {
                outcomes[r.outcome] = (outcomes[r.outcome] || 0) + 1;
            });

            // Sort outcomes in order (trigger first, then follow-ups)
            const outcomeOrder = [
                'Broke High',
                'Broke Low',
                'Broke Both',
                'Broke High (after 1 candle)',
                'Broke Low (after 1 candle)',
                'Broke Both (after 1 candle)',
                'Broke High (after 2 candles)',
                'Broke Low (after 2 candles)',
                'Broke Both (after 2 candles)',
                'Broke High (after 3 candles)',
                'Broke Low (after 3 candles)',
                'Broke Both (after 3 candles)'
            ];

            let html = '';
            outcomeOrder.forEach(o => {
                const count = outcomes[o] || 0;
                if (count > 0) {
                    const pct = (100 * count / results.length).toFixed(1);
                    const cls = `outcome-${o.toLowerCase().replace(/[^a-z]/g, '-')}`;
                    html += `<div class="stat-row">
                        <span class="stat-label">${o}</span>
                        <span class="stat-value ${cls}">${count} (${pct}%)</span>
                    </div>`;
                }
            });

            // Count no-breaks
            const noBreakCount = results.length - Object.values(outcomes).reduce((a, b) => a + b, 0);
            if (noBreakCount > 0) {
                const pct = (100 * noBreakCount / results.length).toFixed(1);
                html += `<div class="stat-row">
                    <span class="stat-label">Never Broke (3 candles)</span>
                    <span class="stat-value" style="color: #475569;">${noBreakCount} (${pct}%)</span>
                </div>`;
            }

            html += `<div class="stat-row">
                <span class="stat-label">Total Patterns</span>
                <span class="stat-value">${results.length}</span>
            </div>`;

            return html;
        }

        function buildCrosstab(results) {
            const patterns = {};
            results.forEach(r => {
                if (!patterns[r.pattern]) patterns[r.pattern] = {};
                patterns[r.pattern][r.outcome] = (patterns[r.pattern][r.outcome] || 0) + 1;
            });

            const outcomes = [
                'Broke High', 'Broke Low', 'Broke Both',
                'Broke High (after 1 candle)', 'Broke Low (after 1 candle)', 'Broke Both (after 1 candle)',
                'Broke High (after 2 candles)', 'Broke Low (after 2 candles)', 'Broke Both (after 2 candles)',
                'Broke High (after 3 candles)', 'Broke Low (after 3 candles)', 'Broke Both (after 3 candles)'
            ];

            const totalPatterns = results.length;

            let html = '<table style="font-size: 11px;"><tr><th>Pattern</th>';
            outcomes.forEach(o => html += `<th style="font-size: 11px;">${o}</th>`);
            html += '<th>Total</th></tr>';

            Object.keys(patterns).sort().forEach(p => {
                let total = 0;
                const counts = [];
                outcomes.forEach(o => {
                    const count = patterns[p][o] || 0;
                    counts.push(count);
                    total += count;
                });

                html += `<tr><td style="font-size: 11px;">${p}</td>`;
                counts.forEach(count => {
                    // % of overall patterns
                    const pct = totalPatterns > 0 ? ((100 * count / totalPatterns).toFixed(1)) : 0;
                    html += `<td style="font-size: 11px;">${count} (${pct}%)</td>`;
                });
                const totalPct = totalPatterns > 0 ? ((100 * total / totalPatterns).toFixed(1)) : 0;
                html += `<td style="font-size: 11px;"><strong>${total} (${totalPct}%)</strong></td></tr>`;
            });

            html += '</table>';
            return html;
        }

        function buildDetailsTable(results) {
            let html = '<table><tr><th>Pattern</th><th>C1</th><th>C2</th><th>C3</th><th>P-High</th><th>P-Low</th><th>N-High</th><th>N-Low</th><th>Outcome</th><th>Follow-Up</th></tr>';

            results.forEach(r => {
                const cls = `outcome-${r.outcome.toLowerCase().replace(' ', '-')}`;
                let followUpDisplay = '';

                if (r.followUpOutcomes && r.followUpOutcomes.length > 0) {
                    followUpDisplay = r.followUpOutcomes.map((o, idx) => {
                        const ocls = `outcome-${o.toLowerCase().replace(/[^a-z]/g, '-')}`;
                        return `<div class="${ocls}" style="margin-bottom: 4px;">${o}</div>`;
                    }).join('');
                }

                html += `<tr>
                    <td>${r.pattern}</td>
                    <td>${r.c1}</td>
                    <td>${r.c2}</td>
                    <td>${r.c3}</td>
                    <td>${r.pHigh}</td>
                    <td>${r.pLow}</td>
                    <td>${r.nHigh}</td>
                    <td>${r.nLow}</td>
                    <td class="${cls}">${r.outcome}</td>
                    <td style="font-size: 12px;">${followUpDisplay}</td>
                </tr>`;
            });

            html += '</table>';
            return html;
        }

        function buildBrokeNoneStats(results) {
            const noneResults = results.filter(r => r.outcome === 'Broke None');
            if (noneResults.length === 0) {
                return '<div class="stat-row"><span class="stat-label">No "Broke None" patterns</span></div>';
            }

            let html = `<div class="stat-row">
                <span class="stat-label">Total "Broke None"</span>
                <span class="stat-value">${noneResults.length}</span>
            </div>`;

            // Count first follow-up outcome for each
            const firstOutcomes = {};
            noneResults.forEach(r => {
                if (r.followUpOutcomes && r.followUpOutcomes.length > 0) {
                    const first = r.followUpOutcomes[0];
                    firstOutcomes[first] = (firstOutcomes[first] || 0) + 1;
                }
            });

            for (let outcome in firstOutcomes) {
                const count = firstOutcomes[outcome];
                const pct = (100 * count / noneResults.length).toFixed(1);
                const cls = `outcome-${outcome.toLowerCase().replace(/[^a-z]/g, '-')}`;
                html += `<div class="stat-row">
                    <span class="stat-label">&nbsp;&nbsp;→ ${outcome}</span>
                    <span class="stat-value ${cls}">${count} (${pct}%)</span>
                </div>`;
            }

            return html;
        }

        function processData(rows) {
            const candles6am = create12hCandles(rows, 6);
            const candles6pm = create12hCandles(rows, 18);

            const results6am = analyzePatterns(candles6am);
            const results6pm = analyzePatterns(candles6pm);

            // Store globally for download
            currentResults6am = results6am;
            currentResults6pm = results6pm;

            document.getElementById('stats-6am').innerHTML = buildStatsTable(results6am);
            document.getElementById('stats-6pm').innerHTML = buildStatsTable(results6pm);

            document.getElementById('crosstab-6am').innerHTML = buildCrosstab(results6am);
            document.getElementById('crosstab-6pm').innerHTML = buildCrosstab(results6pm);

            document.getElementById('details-6am').innerHTML = buildDetailsTable(results6am);
            document.getElementById('details-6pm').innerHTML = buildDetailsTable(results6pm);

            document.getElementById('results').style.display = 'block';
        }
    </script>
</body>
</html>
