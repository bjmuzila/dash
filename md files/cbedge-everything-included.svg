<text x="130" y="559" font-size="19" font-weight="700" fill="#f5f9fc">Fully automatic ICT</text>
<text x="130" y="583" font-size="15" font-weight="400" fill="#93a7ba">Automated ICT chart, tracker, and alerts working for you around the clock.</text>

<rect x="60" y="618" width="1080" height="80" rx="12" fill="#121a24" stroke="#1c2836" stroke-width="1"/>
<rect x="60" y="618" width="4" height="80" fill="url(#accentbar)"/>
<circle cx="100" cy="658" r="16" fill="#0e3a44" stroke="#22d3ee" stroke-width="1.5"/>
<path d="M92 658 L98 664 L109 651" fill="none" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="130" y="651" font-size="19" font-weight="700" fill="#f5f9fc">Morning briefing</text>
<text x="130" y="675" font-size="15" font-weight="400" fill="#93a7ba">A Traders Dashboard with futures, key drivers, and an AI market overview.</text>

