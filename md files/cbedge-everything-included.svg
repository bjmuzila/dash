<path d="M92 474 L98 480 L109 467" fill="none" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="130" y="467" font-size="19" font-weight="700" fill="#f5f9fc">ES candles &amp; flow</text>
<text x="130" y="491" font-size="15" font-weight="400" fill="#93a7ba">5-minute ES heatmaps with net-premium flow and live order tape.</text>

<rect x="60" y="526" width="1080" height="80" rx="12" fill="#121a24" stroke="#1c2836" stroke-width="1"/>
