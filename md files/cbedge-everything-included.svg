<desc>Feature list: Live GEX and levels, Estimated moves, ES candles and flow, Fully automatic ICT live, Morning briefing</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1200" y2="720" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#0a0e14"/>
<stop offset="1" stop-color="#0d1420"/>
</linearGradient>
<linearGradient id="accentbar" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#22d3ee"/>
<stop offset="1" stop-color="#0891b2"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="1200" height="720" fill="url(#bg)"/>

<circle cx="1120" cy="60" r="180" fill="#22d3ee" opacity="0.05"/>
<circle cx="60" cy="680" r="220" fill="#22d3ee" opacity="0.04"/>

<image href="public/cb-edge-logo.png" x="52" y="12" width="220" height="122" preserveAspectRatio="xMidYMid meet"/>

<text x="1140" y="66" text-anchor="end" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#5eead4" letter-spacing="2">LIVE OPTIONS FLOW &amp; GEX</text>

<text x="60" y="152" font-family="Arial, sans-serif" font-size="16" font-weight="700" font-style="italic" fill="#5eead4" letter-spacing="1">Your unfair edge in the markets</text>

<text x="60" y="192" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#f5f9fc">Everything is included.</text>
<text x="60" y="222" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#8aa0b4">No add-ons, no upsells. One subscription, the full dashboard.</text>

