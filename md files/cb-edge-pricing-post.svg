    <text x="640" y="588" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FFFFFF" font-weight="400">per year</text>
    <rect x="892" y="540" width="196" height="46" rx="8" fill="rgba(142,202,230,0.10)" stroke="rgba(142,202,230,0.5)" stroke-width="1.5"/>
