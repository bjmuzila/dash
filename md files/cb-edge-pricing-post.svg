  <rect width="1200" height="675" fill="url(#bgglow2)"/>

  <g transform="translate(918 24) scale(0.117188)"><rect x="45.06" y="45.06" width="421.89" height="421.89" rx="52.22" fill="none" stroke="#fff" stroke-width="13.31"/><rect x="76.26" y="196.81" width="156.24" height="26.98" rx="2.7" fill="url(#cbRed)"/><rect x="272.54" y="196.81" width="161.89" height="26.98" rx="2.7" fill="url(#cbGreen)"/><rect x="76.26" y="250.78" width="156.24" height="26.98" rx="2.7" fill="url(#cbRed)"/><rect x="272.54" y="250.78" width="161.89" height="26.98" rx="2.7" fill="url(#cbGreen)"/><rect x="76.26" y="304.74" width="156.24" height="26.98" rx="2.7" fill="url(#cbRed)"/><rect x="272.54" y="304.74" width="161.89" height="26.98" rx="2.7" fill="url(#cbGreen)"/><rect x="76.26" y="358.71" width="156.24" height="26.98" rx="2.7" fill="url(#cbRed)"/><rect x="272.54" y="358.71" width="161.89" height="26.98" rx="2.7" fill="url(#cbGreen)"/><rect x="76.26" y="412.67" width="156.24" height="26.98" rx="2.7" fill="url(#cbRed)"/><rect x="272.54" y="412.67" width="161.89" height="26.98" rx="2.7" fill="url(#cbGreen)"/><rect x="250.34" y="188.11" width="4.79" height="255.9" rx="2.39" fill="#fff"/></g>
  <text x="1120" y="56" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="26" letter-spacing="1" font-weight="800" fill="#FFFFFF">CB EDGE</text>
  <text x="1120" y="78" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1" fill="#FFFFFF" opacity="0.6">Your edge. Their loss.</text>

  <rect x="80" y="94" width="56" height="3" fill="#FB8501"/>
  <text x="80" y="164" font-family="Arial, Helvetica, sans-serif" font-size="44" fill="#FFFFFF" font-weight="800">What&#8217;s the right price</text>
  <text x="80" y="212" font-family="Arial, Helvetica, sans-serif" font-size="44" fill="#8ECAE6" font-weight="800">to charge a trader?</text>
  <text x="80" y="244" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FFFFFF" font-weight="400">Not trying to overcharge. Here for the</text>
  <text x="80" y="266" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FFFFFF" font-weight="400">trader, not to profit off them.</text>

  <text x="80" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2" fill="#FB8501" font-weight="700">OTHERS CHARGE / MONTH</text>

