server {
    listen 8088;
    server_name voltick.cbedge.net;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 40m;

    # Resolve the backend via Docker's embedded DNS at request time (lazy), so
    # nginx starts even if the dashboard container is momentarily down and never
    # crash-loops on "host not found in upstream". Port must match PORT in
    # .env.local (this deploy = 3002).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $up dashboard:3002;

    # The owner console demo, served by the demo-web container (the same build
    # that answers demo.cbedge.net). It is proxied rather than copied in so
    # there is ONE demo: `node demo-owner/build.mjs` plus a demo-web rebuild
    # updates both hostnames, and this image never holds a second, older copy of
    # a 290KB page that nobody remembers to refresh.
    location = /demo { return 301 /demo/; }

    location /demo/ {
        auth_request /_vkauth;
        # Variables in proxy_pass defer DNS to request time, the same reason
        # $up exists. With a variable, a URI part on proxy_pass would be sent
        # literally instead of having the location prefix stripped, so the
        # prefix comes off with `rewrite ... break` and proxy_pass carries no
        # URI of its own.
        set $demo demo-web:8087;
        rewrite ^/demo/(.*)$ /$1 break;
        proxy_pass http://$demo;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── THE GATE ───────────────────────────────────────────────────────────────
    #
    # Every path below that serves content carries `auth_request /_vkauth`, so
    # nginx asks the backend who you are BEFORE it hands over a single byte.
    #
    # This has to happen HERE and not in React. A gate inside the SPA has
    # already shipped the whole bundle - the contents board, the design system,
    # and /demo/, which is the owner console layout - to the browser before it
    # decides to render a login screen. "Hidden" is not "not sent".
    #
    # The backend route is /api/voltick/verify (server-v2/api-router.js):
    #   200 -> serve      401 no session      403 no grant      503 DB trouble
    # Anything but 200 lands on /denied.html, which is the ONLY page served
    # without a check.
    location = /_vkauth {
        internal;
        # The subrequest inherits the client's Cookie header, which is the whole
        # point: the CB Edge session cookie is domain-wide, so the session from
        # cbedge.net is readable here. No body is forwarded, and no body is read.
        proxy_pass http://$up/api/voltick/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 401 and 403 are different facts (not signed in / signed in without a
    # grant) but the same door, and denied.html explains both. 503 is ours, not
    # theirs, and says so there too.
    error_page 401 403 = @denied;
    error_page 503 = @denied;
    location @denied {
        root /usr/share/nginx/html;
        try_files /denied.html =500;
        add_header Cache-Control "no-store" always;
    }

    # The only unauthenticated page. It is a standalone file, NOT a route in the
    # SPA, because the SPA is exactly what must not be served yet.
    location = /denied.html {
        auth_request off;
        add_header Cache-Control "no-store" always;
    }

    # index.html is the ONLY unhashed file and it names the hashed bundle. If a
    # browser (or Cloudflare) holds an old copy, that device keeps loading the
    # OLD app after a deploy while every other device gets the new one. Never
    # cache it; the fingerprinted assets it points at are cached hard, below.
    location = /index.html {
        auth_request /_vkauth;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # SPA client-side routing: unknown paths fall back to index.html.
    location / {
        auth_request /_vkauth;
        try_files $uri $uri/ /index.html;
    }

    # Data that must hit the CB Edge backend. Anything not named here falls
    # through "location /" to try_files, which hands back index.html, so a fetch
    # for an unproxied path gets a page of HTML rather than a 404. Add every new
    # backend path this app references.
    # Deliberately NOT behind auth_request. These are the backend's own routes
    # and it enforces its own auth on every one of them; putting the gate here
    # too would also gate /api/voltick/verify, which is the gate. An
    # unauthenticated caller reaching /api/* through this host reaches exactly
    # what they would reach at cbedge.net/api/*, so there is no surface here
    # that closing this would remove.
    location ~ ^/(api|proxy|signals\.txt) {
        proxy_pass http://$up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Next-rendered chart pages and their assets, for same-origin iframe embeds.
    location ~ ^/(flow|options-chain|mult-greek|es-candles|gex|_next)(/|$) {
        proxy_pass http://$up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Live GEX websocket (/ws/gex).
    location /ws {
        proxy_pass http://$up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed build assets — cache hard (Vite fingerprints filenames).
    # Gated too: the bundle IS the content. An immutable, fingerprinted URL that
    # anyone can fetch is a public copy of the app with extra steps.
    location /assets/ {
        auth_request /_vkauth;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
