server {
    listen 8088;
    server_name voltick.cbedge.net;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 40m;

    # Resolve the backend via Docker's embedded DNS at request time (lazy), so
    # nginx starts even if the dashboard container is momentarily down and never
    # crash-loops on "host not found in upstream". Port must match PORT in
    # .env.local (this deploy = 3002).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $up dashboard:3002;

    # The owner console demo, served by the demo-web container (the same build
    # that answers demo.cbedge.net). It is proxied rather than copied in so
    # there is ONE demo: `node demo-owner/build.mjs` plus a demo-web rebuild
    # updates both hostnames, and this image never holds a second, older copy of
    # a 290KB page that nobody remembers to refresh.
    location = /demo { return 301 /demo/; }

    location /demo/ {
        # Variables in proxy_pass defer DNS to request time, the same reason
        # $up exists. With a variable, a URI part on proxy_pass would be sent
        # literally instead of having the location prefix stripped, so the
        # prefix comes off with `rewrite ... break` and proxy_pass carries no
        # URI of its own.
        set $demo demo-web:8087;
        rewrite ^/demo/(.*)$ /$1 break;
        proxy_pass http://$demo;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # index.html is the ONLY unhashed file and it names the hashed bundle. If a
    # browser (or Cloudflare) holds an old copy, that device keeps loading the
    # OLD app after a deploy while every other device gets the new one. Never
    # cache it; the fingerprinted assets it points at are cached hard, below.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # SPA client-side routing: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Data that must hit the CB Edge backend. Anything not named here falls
    # through "location /" to try_files, which hands back index.html, so a fetch
    # for an unproxied path gets a page of HTML rather than a 404. Add every new
    # backend path this app references.
    location ~ ^/(api|proxy|signals\.txt) {
        proxy_pass http://$up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Next-rendered chart pages and their assets, for same-origin iframe embeds.
    location ~ ^/(flow|options-chain|mult-greek|es-candles|gex|_next)(/|$) {
        proxy_pass http://$up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Live GEX websocket (/ws/gex).
    location /ws {
        proxy_pass http://$up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed build assets — cache hard (Vite fingerprints filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
