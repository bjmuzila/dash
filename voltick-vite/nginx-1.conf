# voltick-v3 — static SPA, no gate, no backend.
#
# The gate lives in voltick-vite's nginx, which is the only thing that can reach
# this container: it is published on 127.0.0.1 only and is not a Cloudflare
# Tunnel hostname of its own. A second auth_request here would ask the backend
# the same question twice per asset.
#
# Requests arrive with the /v3/ prefix already stripped (see the `rewrite` in
# voltick-vite/nginx.conf), so everything below is written as if this app were
# served at the root. The BROWSER still sees /v3/..., which is what
# `base: '/v3/'` and the router's basename expect.
server {
    listen 8089;
    root /usr/share/nginx/html;
    index index.html;

    # index.html is the only unhashed file and it names the hashed bundle. A
    # cached copy keeps a browser on the old app after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Fingerprinted by Vite, so they can be cached for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: every unknown path is a route, not a file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
