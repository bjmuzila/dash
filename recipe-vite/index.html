<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- #05060A — must match T.paper in src/theme.ts. This paints the browser
         chrome and the splash behind the installed app; left on a light value
         the app flashes white on every cold start. -->
    <meta name="theme-color" content="#05060A" />

    <!-- Installs to the home screen as a standalone app on iOS.
         black-translucent, not default: the shell already pads with
         env(safe-area-inset-top) and the viewport is viewport-fit=cover, so the
         page runs under the status bar instead of leaving a white band. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cookbook" />

    <!-- iOS ignores the manifest icons and uses THIS one, which is why it
         exists separately and why it is opaque: a PNG with transparency gets
         composited on black by iOS and installs as a blank tile. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- .json, not .webmanifest: nginx:alpine's bundled mime.types has no entry
         for the .webmanifest extension, so it would go out as
         application/octet-stream. application/json is accepted for a manifest
         and needs no nginx change. -->
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Newsreader: recipe titles, step numbers, headlines.
         JetBrains Mono: every label, uppercase and letterspaced.
         Inter: body copy and controls. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Cookbook</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
