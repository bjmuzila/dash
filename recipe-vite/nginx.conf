server {
    listen 8084;
    server_name recipe.cbedge.net;
    root /usr/share/nginx/html;
    index index.html;

    # Photo uploads set this, not recipe text. The browser downscales a picked
    # photo to ~1400px before encoding (see downscale() in src/api.ts), so a
    # real upload is 200-400KB of base64 — but a 16m ceiling means an
    # un-downscaled original from a future code path fails on the server's own
    # 8MB check with a clear message, rather than as a bare nginx 413.
    client_max_body_size 16m;

    # Resolve the backend through Docker's embedded DNS at request time, so
    # nginx boots even when the dashboard container is momentarily down instead
    # of crash-looping on "host not found in upstream". Port must match PORT in
    # .env.local (this deploy = 3002).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $up household:3010;

    # SPA client-side routing: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html MUST NOT be cached. It is the one unhashed file in the build
    # and it is what names the hashed bundles — so a browser (or Cloudflare)
    # holding a stale copy keeps loading the OLD app forever, however many
    # times the container is rebuilt. That has cost real time here: a deploy
    # lands, the site looks unchanged, and the hunt starts in the wrong place.
    # /assets/ below is still cached hard, which is safe precisely because
    # those filenames are fingerprinted.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
    }

    # Same narrow surface as budget-vite: ONLY /api is proxied. This app has no
    # reason to reach /proxy (TastyTrade/ThetaData market data) or /ws (the GEX
    # feed), and not proxying them means a bug here can never touch the trading
    # stack.
    location /api {
        proxy_pass http://$up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # An import fetches someone else's blog (up to 15s) and may then run the
        # page through Claude (up to 90s). nginx's 60s default would cut that
        # off right at the point the answer arrives.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Auth endpoints must never be cached anywhere in front of the app. The
    # backend already sends no-store; this is belt-and-braces against a
    # Cloudflare rule ever deciding /api/hh/auth/me looks cacheable.
    location /api/hh/auth {
        proxy_pass http://$up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Hashed build assets — cache hard (Vite fingerprints filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # This is a private household app. Keep it out of every index.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
}
