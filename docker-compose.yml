services:
  dashboard:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* are inlined into the client bundle at BUILD time.
        # Set this in .env (compose reads it) so the owner-only UI works.
        NEXT_PUBLIC_OWNER_USER_ID: ${NEXT_PUBLIC_OWNER_USER_ID:-}
        # Supabase client keys are inlined at BUILD time (auth + subscriber /chat).
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        # Cloudflare Turnstile site key — inlined so the login widget renders.
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    image: bzila-dashboard:latest
    restart: unless-stopped
    # server-v2 reads .env.local at boot (dotenv override:true). Mount your real
    # secrets file there. Keep PORT here in sync with the EXPOSE/healthcheck.
    env_file:
      # .env.local is the single source of truth for PORT and all secrets
      # (server-v2 loads it with dotenv override:true). Next's rewrite also reads
      # process.env.PORT, so the in-process loopback always matches. Set
      # APP_PORT below to whatever PORT you put in .env.local (3001 or 3002).
      - .env.local
    environment:
      NODE_ENV: production
      TZ: America/New_York
    volumes:
      # discord-relay dedupe state. Must outlive the container: without this the
      # seen-set resets on every redeploy, the relay re-primes from the current
      # signals.txt, and any signal that fired while we were down is swallowed.
      # Dedicated dir (not ./data) so the mount doesn't shadow committed files.
      - ./state:/app/state
    ports:
      # Bind to localhost only — Cloudflare reaches the origin via cloudflared
      # tunnel (no public port). Do NOT expose to 0.0.0.0 without TLS+firewall.
      # APP_PORT must equal PORT in .env.local. See DEPLOY_CLOUDFLARE.md.
      - "127.0.0.1:${APP_PORT:-3001}:${APP_PORT:-3001}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||'3001')+'/proxy/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # theta-terminal is GONE — see the note where its service block used to be.
    #
    # The dashboard used to gate on `theta-terminal: condition: service_healthy`
    # to kill a cold-start race ("Feed failed to start: fetch failed" -> spot:0).
    # That race is already handled properly in code: server-with-proxy.js retries
    # feed start forever with backoff (2s -> 30s cap), and its comment says so.
    # The gate was belt-and-braces, and on 2026-08-18 it became a single point of
    # failure — Theta could not boot, so its healthcheck never went green, so
    # compose refused to start the DASHBOARD and took the whole site down with
    # an unrelated container.
    #
    # docker-proxy is deliberately untouched.
    depends_on:
      docker-proxy:
        condition: service_started

  # Locked-down Docker API proxy. Lets the dashboard container (a) read
  # theta-terminal's live CPU/mem stats for the owner page and (b) RESTART
  # theta-terminal when the flow watchdog finds it wedged (state/theta-restart.js)
  # — WITHOUT mounting the raw docker.sock into the app container, since a raw
  # socket mount is root-equivalent host access regardless of any `:ro` flag.
  # Surface is GET /containers* plus POST /containers/*/restart ONLY: start,
  # stop, exec, images, volumes, networks, etc. all stay off, so the worst this
  # can do is bounce a container. Not published to the host — only reachable
  # from sibling containers on the compose network.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      # POST + ALLOW_RESTARTS: required for the watchdog's self-heal restart.
      # ALLOW_START/ALLOW_STOP stay 0 — restart is the only mutation allowed.
      POST: 1
      ALLOW_RESTARTS: 1
      ALLOW_START: 0
      ALLOW_STOP: 0
      EXEC: 0
      IMAGES: 0
      VOLUMES: 0
      NETWORKS: 0
      INFO: 1
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # theta-terminal (ThetaData Terminal) was REMOVED on 2026-08-18.
  #
  # Why: the image never contained a runnable terminal. Dockerfile.theta only
  # ADDed the BOOTSTRAP jar from download-unstable.thetadata.us, and the
  # bootstrap fetched the real runtime jar over the network on EVERY container
  # boot - nothing cached in the image, nothing copied from the repo. When that
  # download started returning 404 the container had no jar to run and no
  # library to fall back on, crash-looped, and (via the dashboard's
  # depends_on: service_healthy) took the entire site down with it.
  #
  # It was also already unused: DATA_SOURCE=tt and INDEX_SOURCE=dxlink, so every
  # live path - the GEX ladder, greeks, OI, volume, the flow tape, /ws/gex, ES/NQ
  # and ETF candles, spot - comes from TastyTrade + dxLink. server-v2/tt-snapshot.js
  # is the drop-in that made that switch, and it is what has been serving all of it.
  #
  # To bring it back: restore this block and deploy/theta/ from git history, but
  # COPY a known-good runtime jar into the image instead of downloading one at
  # boot, and do NOT re-add a depends_on gate on its health.

  # owner.cbedge.net — builds the standalone owner-vite SPA (owner-vite/Dockerfile:
  # node build stage → nginx) and reverse-proxies /api /ws /proxy to the dashboard
  # container (same compose network → dashboard:3002). Reached only via the
  # Cloudflare Tunnel (ingress owner.cbedge.net → 127.0.0.1:8082). No host npm
  # needed — `docker compose build owners` builds the SPA inside Docker.
  owners:
    build:
      context: ./owner-vite
    image: owners-web:latest
    container_name: owners-web
    restart: unless-stopped
    depends_on:
      - dashboard
    ports:
      # Loopback only — Cloudflare Tunnel reaches it, nothing public.
      - "127.0.0.1:8082:8082"

  # affiliate.cbedge.net — the affiliate program SPA (affiliate-vite/Dockerfile:
  # node build stage → nginx), reverse-proxying ONLY /api to the DASHBOARD
  # container (same compose network → dashboard:3002).
  #
  # It talks to the dashboard rather than the household backend because the
  # affiliate ledger lives in server-v2/_lib-affiliate.cjs, in the same process
  # as the Stripe webhook that feeds it — the webhook writes a commission row by
  # posting to 127.0.0.1 inside that container, so putting this app's API
  # anywhere else would mean a second process reading the same tables for no
  # reason.
  #
  # Narrower than the owners service on purpose: no /ws, no /proxy. This is a
  # PUBLIC, signed-out surface — the one CB Edge subdomain a stranger is invited
  # to load — and not proxying the market-data paths means a bug here can never
  # reach the trading stack. See affiliate-vite/nginx.conf.
  #
  # nginx also maps /r/<CODE> onto /api/aff/go, which is the shareable referral
  # link: it logs the click, sets the domain-wide cbe_ref cookie and 302s to
  # cbedge.net/pricing. That has to be a redirect, not a React route — a
  # redirect that waits on a JS bundle is a redirect people bounce out of.
  #
  # Reached only via the Cloudflare Tunnel — add to /etc/cloudflared/config.yml
  # ABOVE the catch-all 404 rule:
  #     - hostname: affiliate.cbedge.net
  #       service: http://127.0.0.1:8085
  # then `cloudflared tunnel route dns <tunnel> affiliate.cbedge.net` and
  # `systemctl restart cloudflared`.
  #
  # Auth is its own system (aff_affiliates / aff_session) — a CB Edge customer
  # session grants nothing here, and an affiliate session grants nothing there.
  affiliates:
    build:
      context: ./affiliate-vite
    image: affiliate-web:latest
    container_name: affiliate-web
    restart: unless-stopped
    depends_on:
      - dashboard
    ports:
      # Loopback only — Cloudflare Tunnel reaches it, nothing public.
      - "127.0.0.1:8085:8085"

  # The household backend — /api/hh/* for budget.cbedge.net and
  # recipe.cbedge.net, in its own process (server-v2/household-server.js).
  #
  # Split out of the dashboard container on 2026-08-12. Before that these routes
  # lived inside api-router.js, which meant a one-line recipe fix required
  # `docker compose build dashboard` — a full `next build` — and a restart that
  # dropped /ws/gex and made Theta reconnect. A cookbook tweak took the trading
  # feed down mid-session. It also meant household code shared a heap with the
  # feed recorders.
  #
  # SAME DATABASE, deliberately: it reads DATABASE_URL from the same .env.local,
  # so "add all" on a recipe still writes hh_list_items rows budget reads, and
  # both apps still share one hh_users login. The process boundary is the
  # isolation; a data boundary would only be work.
  #
  # Loopback-only and not fronted by the tunnel — the two SPA nginx containers
  # reach it over the compose network. The published port is for `curl` on the
  # box when something looks wrong.
  household:
    build:
      context: .
      dockerfile: deploy/household/Dockerfile
    image: cbedge-household:latest
    container_name: household-api
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      TZ: America/New_York
      # NOT `PORT` — .env.local sets that to the dashboard's 3002 and env_file
      # is applied before this block. A separate name means the two can never
      # collide by accident.
      HH_PORT: 3010
    ports:
      - "127.0.0.1:3010:3010"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # budget.cbedge.net — the household life-OS SPA (budget-vite/Dockerfile: node
  # build stage → nginx), reverse-proxying ONLY /api to the household container
  # (same compose network → household:3010). Deliberately narrower than the
  # owners service: this app never needs /ws or /proxy, so it cannot reach the
  # market-data stack at all — and since the split it does not even share a
  # process with it.
  #
  # Reached only via the Cloudflare Tunnel — add to /etc/cloudflared/config.yml
  # ABOVE the catch-all 404 rule:
  #     - hostname: budget.cbedge.net
  #       service: http://127.0.0.1:8083
  # then `cloudflared tunnel route dns <tunnel> budget.cbedge.net` and
  # `systemctl restart cloudflared`.
  #
  # Auth is its own system (hh_users / hh_session); see server-v2/_lib-household.cjs.
  budget:
    build:
      context: ./budget-vite
    image: budget-web:latest
    container_name: budget-web
    restart: unless-stopped
    depends_on:
      - household
    ports:
      # Loopback only — Cloudflare Tunnel reaches it, nothing public.
      - "127.0.0.1:8083:8083"

  # recipe.cbedge.net — the cookbook SPA (recipe-vite/Dockerfile: node build
  # stage → nginx). Same narrow surface as budget: ONLY /api is reverse-proxied,
  # and since 2026-08-12 to the `household` container (household:3010) rather
  # than the dashboard — so this app shares neither a network path nor a process
  # with the market-data stack.
  #
  # Shares the household auth (hh_users / hh_session) and, deliberately, the
  # household TABLES: "add all" writes hh_list_items rows and planning a meal
  # writes hh_meals, so a recipe imported here shows up on budget.cbedge.net's
  # grocery list and week board with no sync step. See
  # server-v2/_lib-household-recipes.cjs.
  #
  # Reached only via the Cloudflare Tunnel — add to /etc/cloudflared/config.yml
  # ABOVE the catch-all 404 rule:
  #     - hostname: recipe.cbedge.net
  #       service: http://127.0.0.1:8084
  # then `cloudflared tunnel route dns <tunnel> recipe.cbedge.net` and
  # `systemctl restart cloudflared`.
  #
  # AI import needs ANTHROPIC_API_KEY in .env.local (read by the HOUSEHOLD
  # container, not this one — the key never leaves the backend). Without it,
  # link imports of sites that publish schema.org data still work; pasted text
  # returns a clear "not set up" message instead.
  recipes:
    build:
      context: ./recipe-vite
    image: recipe-web:latest
    container_name: recipe-web
    restart: unless-stopped
    depends_on:
      - household
    ports:
      # Loopback only — Cloudflare Tunnel reaches it, nothing public.
      - "127.0.0.1:8084:8084"

  # The daily.cbedge.net backend — /api/daily/* in its own process
  # (server-v2/daily-server.js), on its own port, in its own container.
  #
  # A THIRD backend, and the split is deliberate rather than lazy. household-api
  # already exists to keep the private life-OS off the trading process; this one
  # exists because daily.cbedge.net has something neither of the others does —
  # PAYING STRANGERS. A public signup form is an open attack surface, a Stripe
  # webhook has to answer in seconds or Stripe starts disabling the endpoint, and
  # neither of those belongs anywhere near the process recording market data.
  # It also means a bug here can never take the trading stack down, and the
  # container a customer's browser can reach holds `pg` and nothing else.
  #
  # SAME DATABASE, like household: the Markets tab reads the `earnings_calendar`
  # table the trading recorder maintains, and running a second Postgres to hold a
  # copy of it would be pure work. Isolation here is the PROCESS and the SCHEMA —
  # every daily_* table is tenant-scoped by household_id, and this binary has no
  # code path into hh_* or into a cbedge.net session. See _lib-daily.cjs.
  #
  # ./state is mounted READ-ONLY so the economic calendar can read the cache file
  # the dashboard already maintains instead of fetching the same upstream feed a
  # second time. That feed rate-limited the VPS once already when two pollers sat
  # in front of it uncached; see _lib-daily-markets.cjs. Read-only because this
  # process must never be the one writing that file.
  #
  # Loopback-only and not fronted by the tunnel — the daily-web nginx reaches it
  # over the compose network. The published port is for `curl` on the box when
  # something looks wrong.
  daily:
    build:
      context: .
      dockerfile: deploy/daily/Dockerfile
    image: cbedge-daily:latest
    container_name: daily-api
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      TZ: America/New_York
      # NOT `PORT` — .env.local sets that to the dashboard's 3002 and env_file is
      # applied before this block. A separate name means the three backends can
      # never collide by accident.
      DAILY_PORT: 3011
    volumes:
      - ./state:/app/state:ro
    ports:
      - "127.0.0.1:3011:3011"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3011/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # daily.cbedge.net — the public life-OS SPA (daily-vite/Dockerfile: node build
  # stage → nginx), reverse-proxying ONLY /api to the daily container (same
  # compose network → daily-api:3011). Same narrow surface as budget: no /ws, no
  # /proxy, so this app cannot reach the market-data stack at all.
  #
  # Reached only via the Cloudflare Tunnel — add to /etc/cloudflared/config.yml
  # ABOVE the catch-all 404 rule:
  #     - hostname: daily.cbedge.net
  #       service: http://127.0.0.1:8086
  # then `cloudflared tunnel route dns <tunnel> daily.cbedge.net` and
  # `systemctl restart cloudflared`.
  #
  # STRIPE WEBHOOK: the endpoint is https://daily.cbedge.net/api/daily/stripe/webhook
  # and it must be registered in the Stripe dashboard as its OWN endpoint with its
  # OWN signing secret (DAILY_STRIPE_WEBHOOK_SECRET). Do not reuse the CB Edge
  # trading webhook's secret — one endpoint per app is what lets either be
  # rotated or disabled without taking the other's billing down with it.
  #
  # Auth is its own system (daily_users / dy_session). A cbedge.net session grants
  # nothing here, a budget.cbedge.net hh_session grants nothing here, and a
  # dy_session grants nothing anywhere else.
  daily-web:
    build:
      context: ./daily-vite
    image: daily-web:latest
    container_name: daily-web
    restart: unless-stopped
    depends_on:
      - daily
    ports:
      # Loopback only — Cloudflare Tunnel reaches it, nothing public.
      - "127.0.0.1:8086:8086"
